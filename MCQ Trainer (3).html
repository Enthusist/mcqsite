<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MCQ Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: one centered study column. Top bar = source + filters, then progress, question card, note panel. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#16232b; --muted:#5b6b75; --line:#d5dde1;
  --accent:#0f5f73; --accent-ink:#ffffff; --accent-soft:#e0eef2;
  --good:#1f7a4d; --good-soft:#e1f2e8; --bad:#b3372f; --bad-soft:#f8e4e2; --warn-soft:#fbf1d9;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#17232a; --ink:#e6eef1; --muted:#97a8b1; --line:#2b3b44;
  --accent:#5bb8cf; --accent-ink:#06222b; --accent-soft:#1a3640;
  --good:#5fcf94; --good-soft:#163526; --bad:#ef8a82; --bad-soft:#3b1d1b; --warn-soft:#3a3118; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#17232a; --ink:#e6eef1; --muted:#97a8b1; --line:#2b3b44;
  --accent:#5bb8cf; --accent-ink:#06222b; --accent-soft:#1a3640;
  --good:#5fcf94; --good-soft:#163526; --bad:#ef8a82; --bad-soft:#3b1d1b; --warn-soft:#3a3118; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font:600 26px/1.2 var(--serif);margin:0;text-wrap:balance}
.src{font:400 12px var(--mono);color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prog{display:flex;align-items:center;gap:12px;font:400 12px var(--mono);color:var(--muted)}
.track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:18px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.meta span{background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:4px}
.meta .tag{margin-left:auto;background:transparent;color:var(--muted)}
.q{font:500 21px/1.4 var(--serif);margin:0;text-wrap:pretty}
.hint{font:400 12px var(--mono);color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .l{font:500 13px var(--mono);width:26px;height:26px;flex:none;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.opt .t{min-width:0;overflow-wrap:anywhere;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:disabled{cursor:default;color:inherit}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .l{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.miss{border-style:dashed;border-color:var(--good)}
.note{border-radius:8px;padding:14px 16px;background:var(--warn-soft);display:flex;flex-direction:column;gap:6px}
.note b{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.note.right b{color:var(--good)} .note.wrong b{color:var(--bad)}
.note p{margin:0;overflow-wrap:anywhere}
.note small{font:400 12px var(--mono);color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.sum{display:flex;flex-direction:column;gap:14px}
.score{font:600 44px/1 var(--serif)} 
.sum ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-weight:500}
textarea{width:100%;min-height:120px;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 var(--mono)}
#theme{margin-left:auto;font-size:13px}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}
</style>

<main>
  <header>
    <h1>MCQ Trainer</h1>
    <span class="src" id="src"></span>
    <button class="btn" id="theme" type="button" aria-label="Switch colour theme"></button>
  </header>

  <div class="bar">
    <select id="fTopic" aria-label="Topic"></select>
    <select id="fSub" aria-label="Subtopic"></select>
    <select id="fDiff" aria-label="Difficulty">
      <option value="">All levels</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option>
    </select>
    <label class="chk"><input type="checkbox" id="shufQ" checked> Shuffle questions</label>
    <label class="chk"><input type="checkbox" id="shufO"> Shuffle options</label>
  </div>

  <div class="prog"><span id="pos"></span><div class="track"><div class="fill" id="fill"></div></div><span id="score"></span></div>

  <section class="card" id="card" aria-live="polite"></section>

  <details>
    <summary>Load your own questions (CSV)</summary>
    <div class="bar" style="margin-top:10px">
      <input type="file" id="file" accept=".csv,text/csv,text/plain">
      <button class="btn" id="reset">Back to built-in set</button>
    </div>
    <textarea id="paste" placeholder="Or paste CSV text here, with the header row" aria-label="Paste CSV"></textarea>
    <div class="bar" style="margin-top:8px"><button class="btn" id="loadPaste">Load pasted CSV</button></div>
    <p class="err" id="err" role="alert"></p>
  </details>
</main>

<script type="text/plain" id="defcsv">id,topic,subtopic,difficulty,question,option_a,option_b,option_c,option_d,option_e,correct,note,source
Q001,COPD,Diagnosis,1,Which finding confirms the diagnosis of COPD?,Post-bronchodilator FEV1/FVC below 0.8,Pre-bronchodilator FEV1/FVC below 0.7,Post-bronchodilator FEV1/FVC below 0.7,Post-bronchodilator FEV1 below 80% predicted,,C,GOLD confirms COPD with a post-bronchodilator FEV1/FVC below 0.7. The ratio must be measured after the bronchodilator so that reversible obstruction is not counted; FEV1 % predicted is used only to grade severity once the ratio is below 0.7.,"COPD deck, slide 6"
Q002,COPD,Diagnosis,2,Which statements about spirometry in COPD are correct?,A normal pre-bronchodilator spirometry rules COPD out,The GOLD grade (1-4) is defined by the FEV1/FVC ratio,GOLD 2026 recommends universal spirometry screening of all adults,Post-bronchodilator FEV1/FVC below 0.7 confirms COPD,,A;D,"The ratio confirms the diagnosis, and a normal pre-bronchodilator test rules COPD out. The GOLD grade is defined by post-bronchodilator FEV1 % predicted (not the ratio), and GOLD recommends targeted case-finding, not universal screening.","COPD deck, slide 6"
Q003,COPD,Diagnosis,1,Post-bronchodilator FEV1/FVC is 0.62 and FEV1 is 42% of predicted. What is the GOLD grade?,GOLD 2 (moderate),GOLD 1 (mild),GOLD 4 (very severe),GOLD 3 (severe),,D,"Grades by post-BD FEV1: GOLD 1 is 80% or more, GOLD 2 is 50-79%, GOLD 3 is 30-49%, GOLD 4 is below 30%. 42% therefore falls in GOLD 3.","COPD deck, slide 6"
Q004,COPD,Diagnosis,1,What does GOLD 2026 recommend about screening for COPD?,Spirometry only after a first hospital admission,Annual chest X-ray in all smokers,Universal spirometry for every adult,Targeted case-finding: spirometry in adults 40 or older with smoking or biomass exposure and any respiratory symptom,,D,"Universal screening is not recommended; targeted case-finding is. About 70-80% of COPD worldwide is undiagnosed, which is why symptomatic at-risk adults should be tested.","COPD deck, slide 6"
Q005,COPD,Assessment,2,"A 62-year-old has mMRC 1, CAT 6 and had one moderate exacerbation (treated with oral steroids) last year. Which GOLD 2026 group?",Group E,Group A,Group B,Cannot be classified without a hospitalisation,,A,"GOLD 2026 defines Group E by 1 or more moderate or severe exacerbations in the past year, whatever the symptom level. Earlier editions required 2 or more (or 1 hospitalisation). Even a single moderate exacerbation independently raises the risk of the next one.","COPD deck, slide 7"
Q006,COPD,Assessment,2,"mMRC 2, CAT 14, no exacerbation in the past year. Group and initial treatment?",Group B: LABA + ICS,Group E: LABA + LAMA + ICS,Group A: one bronchodilator,Group B: LABA + LAMA,,D,mMRC 2 or more (or CAT 10 or more) with no exacerbation is Group B. Initial treatment is dual bronchodilation (LABA + LAMA). LABA + ICS without a LAMA is discouraged unless features of asthma coexist.,"COPD deck, slides 7 and 14"
Q007,COPD,Treatment strategy,2,"Group E patient, blood eosinophils 120/µL, treatment-naive. Best initial therapy?",LABA + LAMA + ICS,LABA + ICS,ICS alone,LABA + LAMA,,D,"Group E starts on LABA + LAMA. An ICS is added at diagnosis only if eosinophils are 300/µL or more. At 120, add ICS later only if exacerbations continue on LABA + LAMA.","COPD deck, slides 10 and 14"
Q008,COPD,Treatment strategy,2,"Still exacerbating on LABA + LAMA, blood eosinophils 60/µL. Next step?",Start maintenance oral steroids,Add an ICS,Stop all treatment,Add roflumilast or azithromycin,,D,"Eosinophils below 100 predict a poor ICS response, so use a non-ICS add-on: roflumilast or azithromycin. With eosinophils of 100 or more, adding an ICS (triple therapy) is the usual step.","COPD deck, slides 10, 15 and 23"
Q009,COPD,Treatment strategy,3,Exacerbating despite optimised LABA + LAMA + ICS; blood eosinophils 350/µL; chronic bronchitis phenotype. What can a specialist consider?,Benralizumab,Maintenance oral theophylline,Dupilumab (or mepolizumab),Doubling the ICS dose,,C,"With eosinophils of 300 or more on optimised triple therapy, dupilumab (chronic bronchitis phenotype) or mepolizumab can be considered (Level A evidence, BOREAS/NOTUS and MATINEE). Benralizumab did not reduce exacerbations and is not recommended.","COPD deck, slides 12 and 15"
Q010,COPD,Drug arsenal,3,Which statements about biologics in COPD (GOLD 2026) are correct?,Mepolizumab (anti-IL5) reduced exacerbations (MATINEE),Biologics replace triple therapy as first-line treatment,Benralizumab is recommended as it reduces exacerbations,Dupilumab (anti-IL4Rα) is for the chronic bronchitis phenotype with eosinophils 300 or more,,A;D,"Both dupilumab and mepolizumab have Level A evidence. Benralizumab failed to reduce exacerbations. Biologics are specialist-initiated add-ons after LABA + LAMA + ICS has been optimised, never first-line.","COPD deck, slide 12"
Q011,COPD,Drug arsenal,2,Which prescription does GOLD 2026 discourage?,A bronchodilator alone for Group A,LABA + LAMA for Group B,"LABA + ICS without a LAMA, in a patient with no asthma features",LABA + LAMA + ICS with eosinophils 320 and exacerbations,,C,"ICS monotherapy is never used, and LABA + ICS without a LAMA is discouraged unless features of asthma coexist, because dual bronchodilation beats it for preventing exacerbations.","COPD deck, slides 10 and 14"
Q012,COPD,Drug arsenal,1,What is the headline risk of inhaled corticosteroids in COPD?,Hypokalaemia,Pneumonia,Cataract,Adrenal crisis,,B,"Pneumonia is a real, dose-related risk, especially in the elderly and underweight patients. Thrush, hoarseness and bruising are other local effects, and the risk is why ICS is eosinophil-guided rather than routine.","COPD deck, slides 10 and 28"
Q013,COPD,Drug arsenal,3,On triple therapy with eosinophils 380/µL and no exacerbations. When is withdrawing the ICS reasonable?,In patients over 75,After one year without an exacerbation,Whenever eosinophils are 300 or more and the patient is stable,After recurrent pneumonia,,D,"Withdrawing ICS when eosinophils are 300 or more raises the risk of relapse. Withdraw only for pneumonia, no response, or major side effects.","COPD deck, slides 10 and 15"
Q014,COPD,Drug arsenal,2,Which patient is the best candidate for roflumilast?,"Chronic bronchitis phenotype, FEV1 below 50%, frequent exacerbations, low eosinophils",Underweight patient with depression,"Mild COPD, high eosinophils, obesity",Asthma-COPD overlap,,A,"Roflumilast (oral PDE4 inhibitor) targets frequent exacerbators with chronic bronchitis, FEV1 below 50% and low eosinophils. Avoid it in low body weight or depression (nausea, weight loss, insomnia).","COPD deck, slide 11"
Q015,COPD,Drug arsenal,2,"Before starting chronic azithromycin, which checks are advised?",Liver function tests,Serum alpha-1 antitrypsin level,Bone densitometry,Baseline ECG (QT interval),,A;D,"Azithromycin can prolong the QT interval and affect the liver, and causes hearing loss and resistance. Check ECG and LFTs first. It suits frequent exacerbators, preferably former smokers, with low eosinophils.","COPD deck, slide 11"
Q016,COPD,Drug arsenal,1,How often should alpha-1 antitrypsin be measured in a patient with COPD?,Only if under 45,At least once in every COPD patient,Only in never-smokers,Only with a family history of liver disease,,B,"Test once in every COPD patient. If deficient with confirmed emphysema, augmentation therapy exists in some countries.","COPD deck, slides 11 and 28"
Q017,COPD,Treatment strategy,2,Persistent dyspnoea despite LABA + LAMA. What can be considered?,Ensifentrine (inhaled PDE3/4 inhibitor) or specialised non-pharmacological therapy,Azithromycin,Adding an ICS irrespective of eosinophils,Roflumilast,,A,"Track 1 (persistent dyspnoea) escalates from one bronchodilator to LABA + LAMA, then to ensifentrine. Roflumilast, azithromycin and ICS belong to Track 2 (continued exacerbations).","COPD deck, slide 15"
Q018,COPD,Drug arsenal,2,Why can a dry powder inhaler be a problem in severe COPD or during an exacerbation?,It requires a spacer,It requires hand-breath coordination,"It needs a strong inspiratory flow, which may be reduced",It cannot deliver a LAMA,,C,"A DPI relies on the patient's own quick, deep breath. Match the device to inspiratory flow, dexterity and cognition, and check technique at every visit.","COPD deck, slide 13"
Q019,COPD,Non-drug care,3,Which patients meet criteria for long-term oxygen therapy?,Moderate exertional desaturation only,Resting PaO2 54 mmHg,PaO2 58 mmHg without any complication,PaO2 58 mmHg with polycythaemia,,B;D,"LTOT is for severe chronic hypoxaemia: PaO2 55 mmHg or less, or 56-60 mmHg with cor pulmonale or polycythaemia. It improves survival in this group, not in mild-moderate hypoxaemia or isolated exertional desaturation.","COPD deck, slide 17"
Q020,COPD,Exacerbations,2,"RR 26/min, HR 102/min, SpO2 90%, normal dyspnoea VAS and CRP, no acidosis. Rome classification?",Cannot classify without a chest X-ray,Moderate,Severe,Mild,,B,"Rome: moderate means 3 or more abnormal variables out of five (VAS 5 or more, RR 24 or more, HR 95 or more, SpO2 below 92%, CRP 10 mg/L or more). Here RR, HR and SpO2 are abnormal.","COPD deck, slide 19"
Q021,COPD,Exacerbations,2,What makes an exacerbation severe in the Rome proposal?,SpO2 below 88%,Hypercapnia with respiratory acidosis on blood gas,CRP above 50 mg/L,Heart rate above 120/min,,B,"Severe = moderate features plus hypercapnia with respiratory acidosis. Pneumonia, heart failure, pulmonary embolism and pneumothorax can mimic or worsen an exacerbation.","COPD deck, slide 19"
Q022,COPD,Exacerbations,1,Which systemic corticosteroid regimen is recommended for a COPD exacerbation?,Prednisolone 40 mg for 14 days,Prednisolone 40 mg once daily for 5 days,Prednisolone 60 mg for 7 days,Prednisolone 20 mg for 10 days with taper,,B,Prednisolone 40 mg daily for 5 days. Longer courses and higher doses add side effects without added benefit.,"COPD deck, slide 20"
Q023,COPD,Exacerbations,2,Antibiotics in a COPD exacerbation are indicated when:,Cough alone worsens,"Any exacerbation, as a rule",Ventilatory support is needed,Purulent sputum with increased dyspnoea or sputum volume,,C;D,"Antibiotics are not for every exacerbation: give them for purulent sputum plus increased dyspnoea or sputum volume, or when ventilatory support is needed. Course: 5 days, chosen from local resistance patterns.","COPD deck, slide 20"
Q024,COPD,Exacerbations,2,Target oxygen saturation in a hypoxaemic COPD exacerbation?,88-92%,92-95%,96% or above,94-98%,,A,Titrate to SpO2 88-92%. Over-oxygenation can worsen hypercapnia; check blood gases if concerned.,"COPD deck, slide 20"
Q025,COPD,Exacerbations,2,Which are NOT recommended in a COPD exacerbation?,SABA with or without SAMA,"Methylxanthines (theophylline, aminophylline)",Routine chest physiotherapy,Prednisolone for 5 days,,B;C,"Methylxanthines give more side effects without added benefit, and routine chest physiotherapy is not recommended during the acute event. SABA ± SAMA and a 5-day steroid course are first-line.","COPD deck, slide 20"
Q026,COPD,Exacerbations,1,First-choice ventilatory support in acute hypercapnic respiratory failure?,Intubation after a trial of sedation,Non-invasive ventilation,High-flow oxygen alone,Invasive mechanical ventilation,,B,"NIV is the preferred first step: it improves gas exchange, reduces intubation and hospital stay, and improves survival. Invasive ventilation is reserved for NIV failure or intolerance, arrest, or life-threatening hypoxaemia/acidosis with impaired consciousness.","COPD deck, slide 21"
Q027,COPD,Exacerbations,2,When should a patient be reviewed after a COPD exacerbation?,1 week and 6 months,"Within 4 weeks, and again at 12 weeks (with spirometry)",At the next annual review,Within 48 hours only,,B,"Within 4 weeks for clinical review and comorbidity check, and within 12 weeks for spirometry and reassessment of the ABE group and treatment. The strongest predictor of a future exacerbation is a past one.","COPD deck, slide 22"
Q028,COPD,Tailoring,1,A COPD patient has a first myocardial infarction and needs a beta-blocker. What do you do?,Never give a beta-blocker,"Prescribe a cardioselective agent (e.g. bisoprolol, metoprolol)",Prescribe a non-selective agent,Stop all COPD inhalers first,,B,Cardioselective beta-blockers are not withheld in COPD when there is a clear cardiac indication. Non-selective agents can cause bronchospasm.,"COPD deck, slides 27 and 30"
Q029,COPD,Tailoring,2,eGFR 25 mL/min and a LAMA is indicated. What is right?,"Usual dose, monitor anticholinergic effects closely",Double the dose,Switch to theophylline,Contraindicated,,A,"LAMAs are partly renally excreted. They are not contraindicated, but monitor anticholinergic effects when creatinine clearance is below 60 mL/min, and more closely below 30.","COPD deck, slides 26 and 30"
Q030,COPD,Tailoring,2,Theophylline levels are changed by which of the following?,Fall with smoking,Rise with macrolides or ciprofloxacin,Rise with smoking,Unaffected by other drugs,,A;B,Narrow therapeutic window: levels rise sharply with macrolides and ciprofloxacin and fall with smoking. GOLD does not recommend theophylline.,"COPD deck, slide 27"
Q031,COPD,Tailoring,2,Which are LAMA-related risks in the elderly COPD patient?,Bone marrow suppression,Glaucoma,Hepatotoxicity,Urinary retention,,B;D,"Anticholinergic burden brings urinary retention, glaucoma, dry mouth and falls. Review the whole medicine list to avoid overlapping anticholinergics.","COPD deck, slides 25 and 27"
Q032,COPD,Tailoring,2,Which medicines can suppress respiratory drive in a hypercapnic COPD patient?,Sedatives and opioids,Cardioselective beta-blockers,Inhaled LAMAs,Inhaled ICS,,A,"Use sedatives and opioids cautiously, at the lowest effective dose, with monitoring, in respiratory failure with hypercapnia.","COPD deck, slide 27"
Q033,COPD,Non-drug care,1,Which intervention is the single most effective at every stage of COPD?,Mucolytics,Long-term oxygen,Stopping smoking,Azithromycin,,C,"Smoking cessation (and vaping cessation), with pulmonary rehabilitation, has the strongest evidence of all COPD interventions, drugs included. Offer help at every visit.","COPD deck, slides 16 and 29"
Q034,COPD,Non-drug care,1,RSV vaccination in COPD is recommended from what age?,40,75,30,50,,D,"Vaccinate: influenza yearly, pneumococcal, COVID-19, pertussis (Tdap) and RSV from age 50.","COPD deck, slide 16"
Q035,COPD,Non-drug care,2,A BMI below which value independently increases mortality in COPD?,18.5,21,16,25,,B,BMI below 21 carries worse mortality; prevent both underweight and obesity and refer for nutritional support.,"COPD deck, slides 16 and 24"
Q036,COPD,Background,1,"What was the prevalence of COPD in adults aged 40+ in Fez, Morocco (BOLD study)?",6%,29%,3.9%,12.6%,,D,"12.6% (El Rhazi et al., 2016). COPD is the third leading cause of death worldwide, and remains largely under-diagnosed in Morocco outside research studies. (3.9% is the AIRMAG asthma prevalence.)","COPD deck, slide 2"
Q037,COPD,Background,2,What changed in GOLD 2026 about when to escalate treatment?,Escalate only after 2 hospitalisations,Never escalate before 1 year,Escalate after even 1 moderate or severe exacerbation,Escalate only if eosinophils are 300 or more,,C,Earlier editions defined the higher-risk group as 2 or more exacerbations (or 1 hospitalisation). Now 1 or more moderate or severe exacerbations moves the patient into Group E and triggers escalation.,"COPD deck, slides 3, 7 and 8"
Q038,COPD,Drug arsenal,2,Why are bronchodilators the foundation of COPD treatment?,They reduce airway fibrosis,"They reduce hyperinflation and air trapping, the main driver of breathlessness",They replace the need for smoking cessation,They reverse the airflow obstruction completely,,B,"Airflow obstruction is largely fixed; bronchodilators relieve symptoms, reduce hyperinflation and improve exercise tolerance. LABA + LAMA beats either alone or LABA + ICS.","COPD deck, slides 5 and 9"
Q039,Asthma,Diagnosis,2,Which result shows bronchodilator reversibility supporting an asthma diagnosis in adults?,FEV1 up by more than 12% and 200 mL,FEV1 up by 5%,FEV1/FVC above 0.7 after bronchodilator,FVC up by 100 mL,,A,Variable airflow limitation: FEV1 increase of more than 12% and 200 mL after bronchodilator.,"Asthma deck, slide 6"
Q040,Asthma,Diagnosis,2,Which findings can document variable airflow limitation in asthma?,Bronchodilator reversibility (FEV1 > 12% and 200 mL),Positive bronchial challenge,Fixed post-bronchodilator FEV1/FVC below 0.7 with no variation,PEF variability above 10% over 1-2 weeks,,A;B;D,"Variable airflow limitation plus at least one of reversibility, PEF variability above 10%, or positive bronchial challenge. A fixed post-BD ratio below 0.7 points to COPD. Test before starting a controller.","Asthma deck, slide 6"
Q041,Asthma,Diagnosis,2,A patient with typical episodic symptoms has normal spirometry between episodes. What is correct?,Asthma is excluded,COPD is confirmed,Asthma is not excluded,Start a LABA alone,,C,Normal spirometry between episodes does not exclude asthma. Variability is the hallmark; test again when symptomatic or use PEF monitoring/challenge.,"Asthma deck, slide 6"
Q042,Asthma,Assessment,2,"Last 4 weeks: daytime symptoms 3 times a week, night waking once, SABA no more than twice a week, no activity limitation. Control level?",Cannot be assessed without PEF,Uncontrolled,Well controlled,Partly controlled,,D,"Four questions: daytime symptoms more than twice/week, any night waking, SABA more than twice/week, any activity limitation. 0 yes = well controlled, 1-2 = partly, 3-4 = uncontrolled. Here 2 yes (daytime symptoms and night waking).","Asthma deck, slide 7"
Q043,Asthma,Assessment,1,An Asthma Control Test (ACT) score of what indicates well-controlled asthma?,20 or more (out of 25),15 or more,Below 10,10 or more,,A,ACT is scored out of 25; 20 or more means well controlled.,"Asthma deck, slide 7"
Q044,Asthma,Assessment,2,Which are risk factors for future exacerbations?,FEV1 below 60% predicted,Allergic rhinitis treated with a nasal steroid,Severe exacerbation in the past year,3 or more SABA canisters a year,,A;C;D,"Also: uncontrolled symptoms, no ICS or poor adherence/technique, smoking, obesity, past ICU or intubation. Assess both control and risk: a patient with few symptoms can still be at high risk.","Asthma deck, slide 7"
Q045,Asthma,Drug arsenal,2,Why is SABA alone no longer recommended?,It relieves symptoms but does not treat inflammation,"Mild asthma is harmless, so no treatment is needed",SABA alone does not prevent severe exacerbations,Frequent use raises exacerbation risk,,A;C;D,"Mild asthma is not harmless: severe exacerbations can still occur. As-needed budesonide-formoterol cut severe exacerbations by about 60% versus SABA alone (SYGMA 1, Novel START). GINA has not recommended SABA-only since 2019.","Asthma deck, slides 3 and 9"
Q046,Asthma,Drug arsenal,1,Which combination can be used both as maintenance and as reliever (MART)?,Fluticasone furoate-vilanterol,Budesonide-formoterol,Salmeterol alone,Fluticasone-salmeterol,,B,"Only formoterol combinations act within minutes, so they can be a reliever (and each dose also delivers ICS). Salmeterol and vilanterol are slower and need a separate SABA reliever.","Asthma deck, slides 11 and 26"
Q047,Asthma,Drug arsenal,1,What is the safety rule for LABAs in asthma?,Use at night only,Never give a LABA alone: always combine it with an ICS,Prefer LABA to ICS in mild asthma,Use in children under 5,,B,LABA monotherapy increases the risk of severe exacerbations and asthma-related death.,"Asthma deck, slide 11"
Q048,Asthma,Treatment strategy,2,Preferred reliever in GINA Track 1?,Oral montelukast,SABA,ICS-SABA,Low-dose ICS-formoterol,,D,"Track 1 is preferred: fewer severe exacerbations, and one inhaler at every step. Track 2 uses ICS-SABA, or SABA if nothing else.","Asthma deck, slide 16"
Q049,Asthma,Treatment strategy,2,"Track 1, Steps 1-2: what is the recommended treatment?",Daily low-dose ICS plus SABA,"As-needed low-dose ICS-formoterol only (AIR), no daily inhaler",Daily LAMA,Daily montelukast,,B,AIR-only: as-needed low-dose ICS-formoterol. Step 3 is low-dose MART and Step 4 is medium-dose MART.,"Asthma deck, slides 16 and 17"
Q050,Asthma,Treatment strategy,2,"Track 1, Step 4: what is the controller?",Low-dose ICS-formoterol MART,High-dose ICS alone,Medium-dose ICS-formoterol MART,Add-on LAMA only,,C,"Step 3 = low-dose MART, Step 4 = medium-dose MART, Step 5 = refer for phenotype-guided add-ons (LAMA, biologic, high-dose trial).","Asthma deck, slide 16"
Q051,Asthma,Drug arsenal,2,A patient takes fluticasone furoate-vilanterol daily. Which reliever?,No reliever,A second LABA,A SABA (or ICS-SABA),The same inhaler as needed,,C,Vilanterol and salmeterol are slower-acting and cannot be used as reliever. The patient keeps a SABA or ICS-SABA reliever.,"Asthma deck, slides 11 and 17"
Q052,Asthma,Treatment strategy,2,"On MART, when should the patient seek care?",More than 4 inhalations in a day,Any night-time use,Only if PEF falls below 80%,More than 12 inhalations in 24 hours,,D,"Seek care if symptoms worsen fast, no better after 2-3 days, or more than 12 inhalations in 24 hours.","Asthma deck, slides 17 and 20"
Q053,Asthma,Drug arsenal,1,"What is the most common local adverse effect of ICS, and how can it be reduced?",Tremor; reduce LABA,Oral thrush; use a spacer and rinse the mouth,Hypokalaemia; add potassium,Cataract; yearly eye exam only,,B,"Local effects: oral thrush, hoarse voice, cough. Use the lowest effective dose, a spacer with a pMDI, and rinse and spit after use.","Asthma deck, slide 10"
Q054,Asthma,Drug arsenal,2,What should patients and families be warned about with montelukast?,QT prolongation,Adrenal suppression,Hepatotoxicity,"Neuropsychiatric effects: nightmares, agitation, depression, suicidal thoughts",,D,"LTRA are less effective than ICS and are an oral alternative or add-on, useful when allergic rhinitis coexists.","Asthma deck, slide 12"
Q055,Asthma,Drug arsenal,3,Which cautions apply to add-on tiotropium?,Urinary retention,Renal impairment (renally excreted),Hyperthyroidism only,Glaucoma,,A;B;D,"Tiotropium is an add-on at Step 4-5 when exacerbations persist on ICS-LABA, with modest benefit. Monitor if creatinine clearance is below 60 mL/min.","Asthma deck, slides 12 and 29"
Q056,Asthma,Drug arsenal,3,Which biologic works even in low type 2 inflammation?,Dupilumab,Tezepelumab (anti-TSLP),Mepolizumab,Omalizumab,,B,"Tezepelumab (anti-TSLP) is used in severe asthma including low type 2. Omalizumab is anti-IgE (allergic asthma), mepolizumab anti-IL5 (eosinophilic) and dupilumab anti-IL4Rα (type 2 or OCS-dependent).","Asthma deck, slide 13"
Q057,Asthma,Drug arsenal,3,Which patient profile fits omalizumab?,Asthma-COPD overlap,"Low-eosinophil, non-allergic asthma",Mild asthma at Step 2,Allergic asthma with sensitisation to a perennial allergen and raised IgE,,D,"Anti-IgE is for allergic asthma. Biologics are add-ons for severe asthma, prescribed in specialist centres.","Asthma deck, slide 13"
Q058,Asthma,Drug arsenal,2,What should be done before referring for a biologic?,Confirm the diagnosis,Start maintenance oral steroids,Treat comorbidities and remove triggers,Check technique and adherence,,A;C;D,"Maintenance OCS is a last resort. Confirm diagnosis, technique and adherence, comorbidities and triggers, then refer to a specialist.","Asthma deck, slides 13 and 21"
Q059,Asthma,Drug arsenal,2,Which breathing pattern is correct?,"pMDI with spacer: slow, steady breath; dry powder inhaler: quick, deep breath",pMDI: quick breath; DPI: slow breath,"Both: quick, deep breath",Both: slow breath,,A,"Common error: mixing up the two breaths. Also: not shaking a suspension pMDI, pressing and breathing out of sync, no breath-hold, no mouth rinse after ICS.","Asthma deck, slides 14 and 15"
Q060,Asthma,Treatment strategy,1,Asthma uncontrolled on Step 3. What do you do first?,Start maintenance oral steroid,"Check technique, adherence, diagnosis and comorbidities",Step up to Step 4 at once,Refer for a biologic,,B,"Before stepping up: technique, adherence, diagnosis, risk factors (smoking, beta-blockers, NSAIDs, allergens), comorbidities. Then a short-term step-up and review.","Asthma deck, slides 18 and 26"
Q061,Asthma,Treatment strategy,2,Asthma well controlled for 3 months. How should the dose be stepped down?,Stop ICS completely,Switch to SABA only,"Cut the ICS dose by 25-50%, then review before the next step",Double the interval of oral steroid,,C,"Choose a good moment (no infection, travel or pregnancy), have an action plan first, and wait 2-3 months before the next step. Never stop ICS completely.","Asthma deck, slide 18"
Q062,Asthma,Treatment strategy,3,How is difficult-to-treat asthma defined?,Any asthma needing Step 3,"Uncontrolled despite medium or high-dose ICS-LABA, or needing maintenance OCS",Needs SABA once a week,Uncontrolled only when the patient is non-adherent,,B,"Often caused by treatable factors or a wrong diagnosis, not a difficult patient. Severe asthma remains uncontrolled despite good adherence to optimised high-dose ICS-LABA, or needs it to stay controlled. Refer after more than 1 exacerbation a year on medium/high-dose ICS-LABA.","Asthma deck, slide 21"
Q063,Asthma,Exacerbations,2,"Talks in phrases, RR 28/min, SpO2 93%, PEF 55% of best. Severity?",Severe,Life-threatening,Mild,Moderate,,D,"Moderate: talks in phrases, RR up to 30, accessory muscle use, SpO2 92% or more, PEF 50-70%. Severe is any one of: unable to speak, SpO2 below 92%, RR above 30, silent chest, PEF below 50%.","Asthma deck, slide 22"
Q064,Asthma,Exacerbations,2,Which feature alone classifies an exacerbation as severe?,Talks in sentences,SpO2 93%,RR 25/min,PEF below 50% of best,,D,"Any one severe feature is enough. Life-threatening: drowsy, confused, cyanosed or silent chest: transfer at once.","Asthma deck, slide 22"
Q065,Asthma,Exacerbations,3,Which are risk factors for a fatal attack (low threshold to transfer)?,On or just off oral steroids,Severe attack in the past year,SABA use above 1 canister a month,Previous near-fatal asthma,,A;B;C;D,"All four are listed, together with poor support at home as a reason to transfer.","Asthma deck, slides 22 and 24"
Q066,Asthma,Exacerbations,2,Moderate exacerbation in primary care: initial treatment?,Oral steroid alone,"Salbutamol 4-6 puffs up to 3 times, plus ipratropium and an oral steroid",Antibiotics and sedation,Salbutamol 2 puffs only,,B,"Moderate: salbutamol 4-6 puffs by spacer, 20-30 min apart up to 3 times, ipratropium 4 puffs with each dose, and start an oral steroid. Review at 1 hour; worse or not improving: transfer.","Asthma deck, slide 23"
Q067,Asthma,Exacerbations,2,Oral prednisolone for an adult exacerbation:,10 mg for 3 days,40-50 mg each morning for 5-7 days,"Only for severe attacks, never moderate",40 mg for 14 days with a taper,,B,Not needed in mild attacks. No taper is needed under 2 weeks.,"Asthma deck, slide 23"
Q068,Asthma,Exacerbations,2,Target SpO2 when giving oxygen in a severe asthma attack?,88-92%,92-95%,Any value above 90%,98-100%,,B,Oxygen to SpO2 92-95% in asthma (compare 88-92% in COPD).,"Asthma deck, slides 23 and 24"
Q069,Asthma,Exacerbations,3,IV magnesium in a severe exacerbation:,Preferred over salbutamol,Routine for every severe attack,Contraindicated in asthma,One 2 g infusion over 20 min if severe or poor response,,D,Not routine. It is renally cleared and a specialist/hospital measure.,"Asthma deck, slides 24 and 29"
Q070,Asthma,Exacerbations,2,Which should be avoided at discharge after an exacerbation?,Routine antibiotics,Sedatives,"ICS-containing treatment, preferably Step 4 MART",Discharge on SABA alone or without follow-up,,A;B;D,Also avoid routine chest X-ray or blood gases and delaying oral steroids. Review within 2-7 days.,"Asthma deck, slide 25"
Q071,Asthma,Tailoring,2,A 68-year-old with asthma starts glaucoma eye drops. Which is most likely to cause wheeze?,Brimonidine,Dorzolamide,Latanoprost,Timolol,,D,Beta-blocker tablets and eye drops can cause bronchospasm and blunt the reliever. Always ask about beta-blockers (including eye drops) and NSAIDs before prescribing anything new.,"Asthma deck, slides 30 and 32"
Q072,Asthma,Tailoring,2,Why ask about past NSAID/aspirin reactions in asthma?,They raise theophylline levels,They cause thrush,They can trigger severe attacks in aspirin-exacerbated respiratory disease (AERD),They block ICS absorption,,C,Avoid all NSAIDs if the history is suggestive. NSAIDs also risk kidney injury in renal impairment.,"Asthma deck, slides 29 and 30"
Q073,Asthma,Tailoring,3,Which drugs raise systemic ICS exposure through CYP3A4 inhibition?,Itraconazole,Ritonavir,Amlodipine,Clarithromycin,,A;B;D,Risk of adrenal suppression: prefer alternatives or monitor and think of adrenal insufficiency.,"Asthma deck, slide 30"
Q074,Asthma,Tailoring,2,What is the management of asthma in pregnancy?,SABA alone,Switch to oral steroids,Keep ICS-containing treatment: exacerbations harm the baby; review every 4-6 weeks,Stop ICS in the first trimester,,C,Uncontrolled asthma is the larger risk to the baby.,"Asthma deck, slide 31"
Q075,Asthma,Tailoring,3,"Before surgery, when should hydrocortisone cover be given?",Only if eosinophils are high,"If on long-term high-dose ICS, or oral steroids over 2 weeks in the last 6 months",Always in asthma,Never,,B,Continue ICS around surgery.,"Asthma deck, slide 31"
Q076,Asthma,Tailoring,2,Which drug needs closer monitoring if creatinine clearance is below 60 mL/min?,Budesonide-formoterol,Montelukast,Tiotropium,Biologics,,C,Tiotropium is renally excreted. ICS and ICS-formoterol and montelukast need no adjustment and biologics are not renally cleared. Also check potassium with beta-agonists.,"Asthma deck, slide 29"
Q077,Asthma,Background,1,What was the prevalence of asthma in Morocco in the AIRMAG survey (2008)?,3.9%,29%,1%,12.6%,,A,"3.9%; highest in children, older adults and urban areas. Prevalence ranges from about 1% to 29% between countries.","Asthma deck, slide 2"
Q078,Asthma,Treatment strategy,2,"After an exacerbation, when should review occur?",Only if symptoms persist,After 3 months,At the next yearly check,Within 2-7 days,,D,Within 2-7 days with enough medication until then; refer after more than 1 oral steroid course a year or after hospitalisation.,"Asthma deck, slides 20 and 25"
Q079,Asthma vs COPD,Comparison,2,What is the target SpO2 range in a hypoxaemic COPD exacerbation versus a severe asthma attack?,Both 94-98%,"COPD 88-92%, asthma 92-95%",Both 88-92%,"COPD 92-95%, asthma 88-92%",,B,"Over-oxygenation can worsen hypercapnia in COPD, hence the lower range.",Both decks
Q080,Asthma vs COPD,Comparison,2,Which statement about beta-blockers is correct?,Beta-blockers are never given in either disease,"In COPD, a cardioselective beta-blocker is not withheld when there is a clear cardiac indication; in asthma, non-selective agents must be avoided and cardioselective ones need specialist advice",Non-selective beta-blockers are preferred in COPD,Beta-blocker eye drops are safe in asthma,,B,Both decks warn about non-selective agents. For COPD the slide stresses that a cardioselective beta-blocker is not withheld.,Both decks
Q081,Asthma vs COPD,Comparison,2,Which statement about ICS is correct?,"Asthma: every patient needs ICS-containing treatment. COPD: ICS is eosinophil-guided, never alone",Asthma: ICS only when eosinophilic. COPD: ICS for everyone,Both: ICS alone as reliever,Both: ICS never needed,,A,"Asthma-COPD overlap: always include an ICS. In COPD, the headline ICS risk is pneumonia.",Both decks
Q082,Asthma vs COPD,Comparison,1,"Which add-on class is shared between asthma and COPD biologics, using blood eosinophils to select patients?",Benralizumab as the preferred COPD biologic,Theophylline,Omalizumab for COPD,Dupilumab (anti-IL4Rα) and mepolizumab (anti-IL5),,D,Type 2 inflammation crosses disease boundaries: the same eosinophil count guides ICS use and biologic candidacy.,Both decks
N001,CKD conservative care,Basics,1,Conservative treatment of CKD aims to:,Slow progression before end-stage disease,Prevent and treat complications,Prepare for renal replacement therapy (RRT),Restore normal nephron number,,A;B;C,"Conservative treatment covers all lifestyle, dietary and drug measures that slow CKD progression, prevent or treat complications and prepare for RRT. Lost nephrons cannot be restored.","CKD deck, slide 5"
N002,CKD conservative care,Progression,2,Which of these are MODIFIABLE CKD progression factors?,Genetic factors,Male sex,Proteinuria,Nephrotoxic agents,Metabolic acidosis,C;D;E,"Modifiable factors include proteinuria, hypertension, dyslipidaemia, acidosis, anaemia, nephrotoxins, hyperglycaemia, obstruction/infection, dehydration and non-adjusted drug doses. Underlying disease, male sex, age, genetics and GFR at diagnosis cannot be changed.","CKD deck, slide 8-9"
N003,CKD conservative care,Progression,2,A CKD patient on an ACE inhibitor and an NSAID has severe diarrhoea and a sudden rise in creatinine. What is the best approach?,Start dialysis immediately,Increase dietary protein,Rehydrate (isotonic saline or oral water) and stop the NSAID and ACE inhibitor,Increase the diuretic dose,,C,"Dehydration, hypotension, NSAIDs, ACE inhibitors and iodinated contrast precipitate decompensation. Correct the volume, stop or reduce the aggravating drugs and treat the diarrhoea; function can return to baseline.","CKD deck, slide 10 and 29"
N004,CKD conservative care,Progression,2,Which factors precipitate decompensation of CKD by increasing the nitrogen load?,Gastrointestinal bleeding,Regular physical activity,"Hypercatabolism (infection, trauma)",Excessive dietary protein,,A;C;D,"Hypercatabolism, GI bleeding and excessive intake raise nitrogen load. Dehydration, hypotension, NSAIDs, ACE inhibitors and contrast media form a second group.","CKD deck, slide 10"
N005,CKD conservative care,Complications,1,What is the leading cause of death in CKD?,Uraemic encephalopathy,Infection,Hyperkalaemia,Atherosclerotic cardiovascular disease,,D,Atherosclerosis is the leading cause of death. CKD also brings early volume-dependent hypertension and left ventricular hypertrophy.,"CKD deck, slide 11"
N006,CKD conservative care,Complications,2,The anaemia of CKD is typically:,Haemolytic with reticulocytosis,Non-regenerative,Macrocytic from B12 loss,Caused by iron overload,,B,"CKD anaemia is typically normocytic and non-regenerative (reduced erythropoietin). It is treated with iron and erythropoiesis-stimulating agents, not transfusion except in emergencies.","CKD deck, slide 12 and 31"
N007,CKD conservative care,Diet,2,What is the recommended moderate protein restriction in CKD?,0.1-0.3 g/kg/day,No restriction,1.2-1.5 g/kg/day,0.6-0.8 g/kg/day,,D,0.6-0.8 g/kg/day is well tolerated and does not cause malnutrition if energy intake is adequate (35 kcal/kg/day). It needs a motivated patient and physician and an experienced dietitian.,"CKD deck, slide 17-18"
N008,CKD conservative care,Diet,2,A CKD patient passes 800 mL of urine per day. What fluid intake is advised?,3 L/day,500 mL/day,Unrestricted,"About 1,300 mL/day (urine output + 500 mL)",,D,Fluid intake is adjusted to urine output: urine output + 500 mL. Sodium is restricted to 2-4 g/day.,"CKD deck, slide 18"
N009,CKD conservative care,Diet,2,Which statements about vein preservation in CKD are correct?,Radial arterial blood gas sampling is encouraged,Avoid puncturing arm and forearm veins,Avoid the subclavian vein for central catheters,Prefer the jugular or femoral vein for central catheters,,B;C;D,"Preserve veins for a future fistula: limit venepuncture to the dorsum of the hand, avoid subclavian catheters and avoid radial arterial gases.","CKD deck, slide 39"
N010,CKD conservative care,Targets,2,What is the blood pressure target in a CKD patient with albuminuria of 120 mg/24 h?,≤ 130/80 mmHg,≤ 150/90 mmHg,≤ 140/90 mmHg,≤ 110/70 mmHg,,A,"Albuminuria 30 mg/24 h or more: BP ≤ 130/80 mmHg. Albuminuria below 30 mg/24 h: ≤ 140/90 mmHg, whether or not the patient is diabetic.","CKD deck, slide 25"
N011,CKD conservative care,Targets,2,First-line antihypertensive treatment in proteinuric CKD?,Aldosterone antagonist alone,ACE inhibitor or ARB,Thiazide alone,Beta-blocker,,B,"ACE inhibitors or ARBs lower intraglomerular pressure and reduce proteinuria by 30-35%. Diuretics, calcium channel blockers or beta-blockers are added if needed.","CKD deck, slide 26"
N012,CKD conservative care,Targets,2,Which proteinuria target is recommended?,Complete disappearance within a month,"Protein/creatinine ratio < 500 mg/mg, or 24 h proteinuria < 0.5 g, or a 50-60% reduction",Proteinuria < 3 g/day,No target,,B,"Targets: P/C ratio below 500 mg/mg, 24-hour proteinuria below 0.5 g/day, or a 50-60% reduction in proteinuria.","CKD deck, slide 25"
N013,CKD conservative care,Targets,2,"LDL target in a CKD patient WITH cardiovascular risk factors, and what should be monitored on a statin?",LDL < 1 g/L; monitor potassium,LDL < 2 g/L; monitor creatinine only,LDL < 1.3 g/L; monitor TSH,LDL < 1 g/L; monitor transaminases and CPK (rhabdomyolysis),,D,"Target is LDL below 1.3 g/L without cardiovascular risk factors and below 1 g/L with them. Statins (atorvastatin, pravastatin, simvastatin) need transaminase and CPK monitoring.","CKD deck, slide 19 and 27"
N014,CKD conservative care,Targets,2,Metabolic acidosis in CKD: what is the target and the treatment?,Bicarbonate > 35 mEq/L; IV bicarbonate daily,"Bicarbonate > 23 mEq/L; oral sodium bicarbonate or Vichy water, 0.5-1 mEq/kg/day",pH > 7.5; sodium chloride,No treatment is needed,,B,Aim for bicarbonate above 23 mEq/L and pH 7.38-7.42 using Vichy mineral water or oral bicarbonate.,"CKD deck, slide 28"
N015,CKD conservative care,Targets,1,HbA1c target in a diabetic CKD patient?,≤ 10%,≤ 7%,≤ 5%,≤ 9%,,B,"HbA1c ≤ 7%, using diet, oral antidiabetic agents or insulin.","CKD deck, slide 28"
N016,CKD conservative care,Anaemia,2,Anaemia in CKD: which statements are correct?,ESAs are started early (stage 3) if Hb < 10 g/dL is due to CKD,Ferritin should be ≥ 150 ng/mL (not on HD) without exceeding 500 ng/mL,Target Hb is 10.5-11.5 g/dL,Transfusions are the routine treatment,,A;B;C,"Transfusions are reserved for emergencies. Replete iron (ferritin ≥ 150, max 500 ng/mL off HD) and start ESAs early.","CKD deck, slide 31"
N017,CKD conservative care,Anaemia,3,Which rules apply to ESA dosing?,"Adjust doses every 15 days initially, then monthly",Increase the dose weekly until Hb exceeds 13 g/dL,Hb rise of at most 1-2 g/dL per month,Dose not increased more than once every 4 weeks,,A;C;D,Raise Hb gradually (maximum 1-2 g/dL over a month) towards 10.5-11.5 g/dL. Darbepoetin alfa starts at 0.45 µg/kg/week.,"CKD deck, slide 21-22"
N018,CKD conservative care,Anaemia,2,Why is IV iron often preferred over oral iron in CKD?,IV iron replaces ESAs,Oral iron has poor gastrointestinal absorption and tolerability in CKD,Oral iron is nephrotoxic,IV iron raises hepcidin,,B,"IV iron loading dose is 1,000 mg over 8-10 consecutive sessions, then 50-125 mg weekly, every 2 weeks or monthly depending on iron stores.","CKD deck, slide 20"
N019,CKD conservative care,Complications,2,Hyperphosphataemia: which statements are correct?,Calcium carbonate binders are taken with meals,Sevelamer is taken fasting at bedtime only,"Non-calcium binders (sevelamer, lanthanum) are used if serum calcium is > 95 mg/L",Dietary phosphate is restricted to about 900 mg/day,,A;C;D,"Binders must be taken with meals so they bind dietary phosphate: sevelamer 800-1,600 mg three times a day, lanthanum 1,500-3,000 mg/day in 3 doses.","CKD deck, slide 23 and 34"
N020,CKD conservative care,Complications,2,Conservative management of hyperkalaemia in CKD includes:,Spironolactone,Potassium-sparing diuretics,Low-potassium diet (40-70 mEq/day) and ion-exchange resins (Kayexalate),High-potassium diet,,C,Diet and resins are the conservative measures. Potassium-sparing diuretics are hazardous in kidney failure.,"CKD deck, slide 33"
N021,CKD conservative care,Complications,2,Volume overload in CKD is managed by:,"Low-sodium diet, fluid intake adjusted to urine output, and a loop diuretic",Spironolactone,Thiazides in all cases,Free fluid intake,,A,Loop diuretics are the diuretic of choice in CKD.,"CKD deck, slide 33"
N022,CKD conservative care,Complications,2,What daily energy intake is recommended in pre-dialysis CKD malnutrition?,10-15 kcal/kg/day,50-60 kcal/kg/day,30-35 kcal/kg/day,No fixed target,,C,Malnutrition is common pre-dialysis. Detect it early (low albumin) and involve a dietitian.,"CKD deck, slide 32"
N023,CKD conservative care,RRT preparation,2,From which CKD stage should RRT preparation begin?,Only when uraemic symptoms appear,Stage 3B,Stage 1,Only stage 5,,B,"Starting early (from 3B) reduces morbidity and mortality and allows education, vascular access planning, waiting list registration and living-donor work-up.","CKD deck, slide 37"
N024,CKD conservative care,RRT preparation,1,"Which is the treatment of choice for ESKD, when available?",Conservative treatment only,Kidney transplantation,Haemodialysis,Peritoneal dialysis,,B,"Transplantation improves quality of life and reduces mortality. HD and PD are complementary, not competing. Preemptive transplantation from a living donor is the ideal.","CKD deck, slide 37-38"
N025,CKD conservative care,RRT preparation,2,When is an AV fistula creation recommended?,Only after the first dialysis session,At GFR 60 mL/min,"Once GFR is < 25 mL/min, allowing time for maturation (about 4-6 weeks or more)",Never before stage 5,,C,"Create it months before starting haemodialysis. A PD catheter can be used immediately with small supine volumes, but wait 10-14 days to lower the leakage risk.","CKD deck, slide 41"
N026,CKD conservative care,RRT preparation,2,"To reduce the risk of leakage after PD catheter insertion, how long should full-volume use be delayed?",No delay is needed,10-14 days,3 months,24 hours,,B,The catheter may be used at once with small volumes in the supine position.,"CKD deck, slide 41"
N027,CKD conservative care,Vaccination,2,Hepatitis B vaccination in CKD:,Not recommended,Standard dose once,Oral route,"Double dose (e.g. 2 × 20 µg IM) at 0, 1, 2 and 6 months for Engerix B",,D,Monitor anti-HBs antibodies (target ≥ 10 IU). Pneumococcal boosters at 3 and 5 years; influenza every year.,"CKD deck, slide 40"
N028,CKD conservative care,RRT preparation,3,Which are urgent indications for starting dialysis?,Uraemic encephalopathy or neuropathy,Pulmonary oedema refractory to diuretics,Uraemic pericarditis,Isolated GFR of 40 mL/min with no symptoms,,A;B;C,"Also: uraemic bleeding, refractory hyperkalaemia, acidosis or hyperphosphataemia, and nausea, vomiting, weight loss or malnutrition.","CKD deck, slide 42"
N029,CKD conservative care,RRT preparation,3,A patient has GFR 12 mL/min with evidence of uraemia and fluid status that cannot be controlled. What do you do?,Wait until GFR is below 5,Start dialysis,Increase protein intake,Stop all antihypertensives,,B,"Consider dialysis when GFR < 15 mL/min with uraemia, uncontrolled volume status or BP, or worsening nutrition. Most patients become symptomatic at GFR 9-6 mL/min.","CKD deck, slide 43"
N030,CKD conservative care,Staging,2,A patient has GFR 24 mL/min. Which management applies?,"Information, choice of RRT modality, vascular access, waiting list, discuss pre-emptive living-donor transplantation",Start dialysis immediately,No action until GFR < 15,Only treat progression factors,,A,"Stage 4 (GFR 15-30). Stage 3 (30-60) focuses on complications, vein preservation and hepatitis B vaccination. Stages 1-2 (> 60): aetiological diagnosis, treat progression factors and CV risk. Stage 5 (< 15): HD, PD or transplantation.","CKD deck, slide 45-48"
N031,CKD conservative care,Staging,2,Which actions belong to CKD stage 3 management?,Place the patient on a dialysis waiting list,Vaccinate against hepatitis B,Preserve veins,"Treat complications (anaemia, acidosis, hyperkalaemia, bone-mineral disorders)",,B;C;D,Waiting list placement is a stage 4 action.,"CKD deck, slide 46-47"
N032,CKD conservative care,Follow-up,1,"How often should moderate, severe and pre-end-stage CKD be monitored?","Monthly, weekly, daily",Every 2 years for all,"Every 6 months, every 3 months, monthly","Yearly, every 6 months, every 3 months",,C,Follow-up frequency rises with the degree of renal insufficiency.,"CKD deck, slide 50"
N033,CKD conservative care,Follow-up,2,An abrupt deterioration in kidney function in a CKD patient should prompt:,Immediate dialysis in all cases,Stopping follow-up,"A search for aggravating factors, whose early treatment can restore baseline function",Increasing the protein intake,,C,"Typical culprits: dehydration, obstruction, infection, nephrotoxic drugs, hypotension, contrast media.","CKD deck, slide 54"
N034,Dialysis,Principles,1,Which pairing of dialysis technique and membrane is correct?,Both use an artificial membrane,Haemodialysis: artificial membrane (extracorporeal); peritoneal dialysis: natural membrane (intracorporeal),Both are intracorporeal,Haemodialysis: natural; peritoneal: artificial,,B,"Dialysis uses a semipermeable membrane for exchange between blood and dialysate, removing uraemic toxins and correcting hydro-electrolytic, phosphocalcic and acid-base disturbances.","Dialysis deck, slide 5-6"
N035,Dialysis,Principles,2,Which pass through the dialysis semipermeable membrane?,Electrolytes,Solutes smaller than albumin,Red blood cells,Water,,A;B;D,"Solutes with a molecular weight lower than albumin cross; plasma proteins and blood cells (RBC, WBC, platelets) do not.","Dialysis deck, slide 6"
N036,Dialysis,Principles,2,Diffusion in dialysis is:,Solvent transfer driven by an osmotic gradient,Passive solute transfer down a concentration gradient without bulk solvent movement,Water and solute transfer driven by hydrostatic pressure,Binding of solutes to the membrane,,B,"The other options describe convection, osmosis and adsorption.","Dialysis deck, slide 7-15"
N037,Dialysis,Principles,2,Convection (ultrafiltration) is driven by:,A transmembrane hydrostatic pressure gradient,Membrane charge,A concentration gradient,Oncotic pressure of dialysate,,A,"Water and solutes move together, predominantly iso-osmotically. Influencing factors include molecular weight, membrane permeability and blood flow.","Dialysis deck, slide 11-12"
N038,Dialysis,Principles,3,Which factors influence solute transfer by diffusion?,Blood flow rate,Dialysate flow rate,Transmembrane hydrostatic pressure only,Membrane surface area and thickness,,A;B;D,"Also pore density/diameter and solute concentration, weight and protein binding. Hydrostatic pressure drives convection.","Dialysis deck, slide 9"
N039,Dialysis,Principles,2,Adsorption in dialysis refers to:,Passive diffusion,"Solute binding to the membrane surface or matrix, without necessarily passing into the dialysate",Transfer by pressure,Water movement from interstitium to plasma,,B,Mediated by electrical or chemical interactions and depends on the membrane's physicochemical properties.,"Dialysis deck, slide 15"
N040,Dialysis,Indications,2,Which are indications for dialysis in acute kidney injury?,Uraemic encephalopathy,Hyperkalaemia,Severe metabolic acidosis,Pulmonary oedema,,A;B;C;D,"In CKD: symptomatic stage 5, usually GFR < 15 mL/min. Other indications: hypernatraemia, hypercalcaemia and intoxications.","Dialysis deck, slide 17"
N041,Dialysis,Haemodialysis,1,Which is a permanent vascular access for haemodialysis?,Arteriovenous fistula (native or prosthetic),Non-tunneled femoral catheter,Peripheral cannula,Non-tunneled jugular catheter,,A,Catheters (tunneled or non-tunneled) are temporary options. A good access needs minimal recirculation and adequate blood flow.,"Dialysis deck, slide 20 and 24"
N042,Dialysis,Haemodialysis,2,Which are components of haemodialysis?,Vascular access,Dialysate,Dialysis machine and blood circuit,Haemodialyser,,A;B;C;D,"All five elements are needed: access, dialyser, generator, blood circuit, dialysate.","Dialysis deck, slide 19"
N043,Dialysis,Haemodialysis,2,"In the extracorporeal circuit, the arterial line (red) and venous line (blue) carry blood:",Both to the dialyser,Arterial: from the patient to the dialyser; venous: back to the patient,Arterial line carries dialysate,Arterial: back to the patient; venous: to the dialyser,,B,"Needles are 15G, 16G or 17G. The air detector sits on the venous line.","Dialysis deck, slide 25-26"
N044,Dialysis,Haemodialysis,3,Unfractionated heparin during haemodialysis:,Started only in the final hour,"Bolus 50 IU/kg, then 800-1,500 IU/h, stopped during the final hour",Never used,"Bolus 500 IU/kg, no infusion",,B,Enoxaparin (LMWH) 0.7-1 mg/kg is an alternative; the dose depends on the agent.,"Dialysis deck, slide 27"
N045,Dialysis,Haemodialysis,2,"In the haemodialyser, blood and dialysate flow:",Dialysate does not flow,In countercurrent directions,Perpendicular,In the same direction,,B,Hollow-fibre dialysers are the current standard; parallel-plate ones are no longer routinely used.,"Dialysis deck, slide 28"
N046,Dialysis,Haemodialysis,2,Which is a synthetic dialysis membrane?,Cellulose diacetate,Polysulfone,Cellulose triacetate,Cuprophan,,B,"Cuprophan is regenerated cellulose; cellulose di- and triacetate are modified cellulose. Synthetic: polysulfone, polyethersulfone. Membranes are also low-, medium- or high-flux.","Dialysis deck, slide 29-30"
N047,Dialysis,Haemodialysis,2,The dialysate is prepared from:,Tap water,Reverse-osmosis purified water plus acid and bicarbonate concentrates,Normal saline,Ringer's lactate,,B,"Its composition is individualised to the patient. The conventional flow rate is about 500 mL/min, countercurrent to blood.","Dialysis deck, slide 31"
N048,Dialysis,Haemodialysis,3,The dialysis machine monitors and controls:,Blood-leak detection and air detection,Ultrafiltration and degassing,"Dialysate flow, composition, pH, temperature, pressure",Serum potassium directly,,A;B;C,"It also drives the calibrated blood pump, performs disinfection and contributes to quality control.","Dialysis deck, slide 33-34"
N049,Dialysis,Haemodialysis,2,Which event is classified as a severe or specific complication of haemodialysis?,Headache,Muscle cramps,Nausea,Dialysis disequilibrium syndrome,,D,"Frequent events: intradialytic hypotension or hypertension, nausea and vomiting, cramps, headache. Severe or specific: disequilibrium syndrome, arrhythmia, haemolysis, hard-water syndrome, convulsions.","Dialysis deck, slide 36"
N050,Dialysis,Peritoneal dialysis,2,The peritoneal membrane consists of:,"Mesothelium, submesothelial interstitium and peritoneal capillary endothelium",Cellulose fibres,Mesothelium only,"Pleura, pericardium, diaphragm",,A,Each layer is a barrier to fluid and solute transfer.,"Dialysis deck, slide 39"
N051,Dialysis,Peritoneal dialysis,2,"In peritoneal dialysis, clearance of waste occurs by ___ and water balance is restored by ___.",Diffusion; osmosis,Adsorption; convection,Convection; adsorption,Osmosis; diffusion,,A,Dialysate dwells in the peritoneal cavity (the dialysis compartment).,"Dialysis deck, slide 40"
N052,Dialysis,Peritoneal dialysis,2,Which patients are good candidates for peritoneal dialysis?,Elderly or cardiac patients,Young children,Patients with a history of peritonitis,Patients with difficult vascular access,,A;B;D,"Also patients awaiting transplantation, working patients and those fearing needles. Main contraindications: history of peritonitis and severe respiratory insufficiency.","Dialysis deck, slide 41-42"
N053,Dialysis,Peritoneal dialysis,2,Which are RELATIVE contraindications to peritoneal dialysis?,Gastro-oesophageal reflux,Non-adherence and poor hygiene,Young age,Hernias or incisional hernias,,A;B;D,Also body-image disorders.,"Dialysis deck, slide 42"
N054,Dialysis,Peritoneal dialysis,2,"Where is the PD catheter tip placed, and how is it anchored?",Subphrenic space; no cuffs,"Pouch of Douglas; internal cuff sutured to parietal peritoneum, external cuff heals in tissue",Pouch of Douglas; no cuffs,Liver capsule; sutured to skin,,B,"It has an intra-abdominal segment, a subcutaneous tunnel and an external segment connected to an extension set.","Dialysis deck, slide 43-46"
N055,Dialysis,Peritoneal dialysis,2,"Approximate durations of the three PD phases (infusion, dwell, drainage):","1 h, 8 h, 2 h","20 min, 4 h, 10 min","10 min, 4 h, 20 min","5 min, 30 min, 5 min",,C,Filling and drainage are by gravity; the patient may continue normal activities during the dwell.,"Dialysis deck, slide 47-49"
N056,Dialysis,Peritoneal dialysis,2,Which PD solution gives sustained ultrafiltration during long dwells?,Amino acids 1.1%,Glucose-based,Normal saline,Icodextrin 7.5%,,D,"Icodextrin suits high transporters and fluid overload. Amino acids 1.1% gives ultrafiltration plus nutrition in selected malnourished patients. Glucose is the standard agent with rapid, concentration-dependent UF.","Dialysis deck, slide 50"
N057,Dialysis,Peritoneal dialysis,1,CAPD and APD differ in that:,Both require hospital,CAPD is manual; APD uses an automated cycler during sleep,CAPD is automated; APD is manual,APD uses blood lines,,B,Exchanges may be manual (CAPD) or automated (APD).,"Dialysis deck, slide 51-52"
N058,Dialysis,Peritoneal dialysis,2,Which are INFECTIOUS complications of peritoneal dialysis?,Exit-site infection,Tunnel infection,Dialysate leaks,Peritonitis,,A;B;D,"Non-infectious complications: dialysate leaks, hernias, nutritional complications and protein loss into the dialysate.","Dialysis deck, slide 53"
N059,Diuretics,Physiology,2,A diuretic is defined as a substance that:,Reduces glomerular filtration,"Produces natriuresis, increasing urinary sodium and water excretion",Increases urine output only by water loading,Is an osmotic agent such as mannitol,,B,"Water loading, aquaretics and osmotic agents (mannitol, hypertonic glucose) increase urine output without being natriuretic diuretics. Main drawbacks: potassium disorders and volume depletion.","Diuretics and fluids deck, slide 6"
N060,Diuretics,Physiology,2,Approximately how much of filtered sodium is reabsorbed by the tubule?,About 80%,About 10%,About 50%,More than 99%,,D,"The glomerulus filters about 180 L/day and 27,000 mmol/day of sodium. Sodium enters the cell by apical channels or transporters and leaves through the basolateral Na+/K+-ATPase.","Diuretics and fluids deck, slide 7 and 10"
N061,Diuretics,Physiology,3,Which nephron segment reabsorbs the largest share of filtered sodium?,Distal convoluted tubule (about 65%),Proximal tubule (about 65%),Thick ascending limb (about 65%),Collecting duct (about 65%),,B,"Approximate values: proximal tubule 65% (NHE3), thick ascending limb 25% (NKCC2), distal convoluted tubule 5-8% (NCC), collecting duct about 1.5% (ENaC). Distal segments fine-tune excretion.","Diuretics and fluids deck, slide 9 (speaker notes)"
N062,Diuretics,Physiology,2,Match the drug to its target: loop diuretics act on:,ENaC in the collecting duct,NCC in the distal convoluted tubule,Carbonic anhydrase in the proximal tubule,NKCC2 in the thick ascending limb,,D,Loop diuretics also reduce paracellular Ca2+ and Mg2+ reabsorption and abolish the lumen-positive potential. The thick ascending limb is impermeable to water.,"Diuretics and fluids deck, slide 13"
N063,Diuretics,Physiology,2,Thiazides inhibit the ___ and ___ urinary calcium excretion.,NaCl cotransporter (NCC); reduce,NKCC2; increase,Carbonic anhydrase; increase,ENaC; reduce,,A,"Thiazides enhance calcium reabsorption (hypocalciuria), the opposite of loop diuretics (hypercalciuria).","Diuretics and fluids deck, slide 14 and 25"
N064,Diuretics,Physiology,2,Which statements about potassium-sparing diuretics are correct?,Spironolactone antagonises the mineralocorticoid receptor,They act in the connecting tubule and collecting duct,They act on NKCC2,Amiloride and triamterene block ENaC,,A;B;D,They are weak natriuretics that reduce potassium loss.,"Diuretics and fluids deck, slide 15 and 29"
N065,Diuretics,Drugs,2,Adverse effects of acetazolamide include:,Sulfonamide hypersensitivity,Urinary calculi,Metabolic acidosis,Metabolic alkalosis,,A;B;C,"Weak diuretic action. Indications: open-angle glaucoma, altitude sickness, periodic paralysis, selected epilepsies.","Diuretics and fluids deck, slide 18-19 and 33"
N066,Diuretics,Drugs,1,What is a current indication for acetazolamide?,Acute pulmonary oedema,Idiopathic hypercalciuria,Reducing intraocular pressure in open-angle glaucoma,Hyperaldosteronism,,C,It lowers secretions (aqueous humour); it is rarely used as a natriuretic.,"Diuretics and fluids deck, slide 33"
N067,Diuretics,Drugs,2,Which are adverse effects of furosemide?,Hyperkalaemia,"Reduced urinary concentrating capacity, metabolic alkalosis",Hypercalciuria,Hypokalaemia,,B;C;D,Furosemide is a strong diuretic. Ototoxicity is a risk at high doses.,"Diuretics and fluids deck, slide 22-23"
N068,Diuretics,Drugs,2,Factors associated with loop diuretic resistance:,Hypoalbuminaemia,Hyperkalaemia,High albumin,Hypovolaemia,,A;D,"Uncorrected volume depletion, hypokalaemia and hypocalcaemia are contraindications. Ototoxicity is a particular concern.","Diuretics and fluids deck, slide 23"
N069,Diuretics,Drugs,2,Typical furosemide dose for a patient with CKD and GFR below 20 mL/min?,500 mg,160-200 mg,40 mg,80-120 mg,,B,Normal function 40 mg; GFR < 50: 80-120 mg; GFR < 20: 160-200 mg; AKI 500 mg; nephrotic syndrome and heart failure 120-160 mg.,"Diuretics and fluids deck, slide 36"
N070,Diuretics,Drugs,2,Typical furosemide dose for acute kidney injury to increase urine output?,80 mg,40 mg,500 mg,1 mg,,C,"Slow IV administration per injection is 40-125 mg, up to 1.5 g/day.","Diuretics and fluids deck, slide 20 and 36"
N071,Diuretics,Drugs,2,Adverse effects of thiazide diuretics include:,Hypomagnesaemia,Hypernatraemia,Hyperuricaemia,Hypokalaemia,,A;C;D,"Also hyponatraemia. Contraindicated in sulfonamide allergy; relative contraindications: diabetes mellitus, digitalis therapy, uncorrected hypokalaemia.","Diuretics and fluids deck, slide 26-27"
N072,Diuretics,Drugs,2,Which condition is treated by thiazides through increased calcium reabsorption?,Hypokalaemia,Idiopathic hypercalciuria,Hypercalcaemia,Acute pulmonary oedema,,B,Also oedematous states and low-dose hypertension therapy.,"Diuretics and fluids deck, slide 37"
N073,Diuretics,Drugs,3,Which statements about potassium-sparing diuretics are correct?,"Spironolactone can cause gynaecomastia, impotence and metrorrhagia",They can cause hyperchloraemic metabolic acidosis,They are the strongest natriuretics,They are contraindicated in hyperkalaemia and severe chronic kidney failure,,A;B;D,"They are weak natriuretics, generally not used primarily for natriuresis, and hazardous in renal failure.","Diuretics and fluids deck, slide 29-30"
N074,Diuretics,Indications,2,Spironolactone is specifically indicated in:,Open-angle glaucoma,Acute pulmonary oedema,Liddle syndrome,"Oedema of cirrhosis, heart failure and primary mineralocorticoid excess",,D,Amiloride is used in Liddle syndrome. Shared indications: hyperaldosteronism and correction of hypokalaemic alkalosis from thiazides or loop diuretics.,"Diuretics and fluids deck, slide 38-39"
N075,Diuretics,Indications,2,Which are indications for loop diuretics?,"Oedema of renal, hepatic or cardiac origin",Idiopathic hypercalciuria,Acute pulmonary oedema,Hypercalcaemia (with isotonic saline),,A;C;D,"Also hypervolaemic hyponatraemia, AKI (to increase urine output), and CKD to maintain residual diuresis (oral doses up to 1 g/day). Their role in hypertension is limited.","Diuretics and fluids deck, slide 34-35"
N076,Diuretics,Indications,1,Emergency indications for furosemide include:,Fluid overload with AKI,Acute pulmonary oedema,Acute cor pulmonale,Acute hypercalcaemia,,A;B;C;D,All four are listed under emergency treatment.,"Diuretics and fluids deck, slide 40"
N077,Diuretics,Combinations,3,What is the principle of diuretic combinations?,Combine two potassium-sparing diuretics,Combine thiazide with acetazolamide,Combine two loop diuretics,Combine a potassium-wasting diuretic with an agent acting on the distal nephron,,D,"Examples: amiloride + hydrochlorothiazide, spironolactone + altizide, triamterene + hydrochlorothiazide. The natriuretic potency depends mainly on the potassium-wasting component.","Diuretics and fluids deck, slide 31"
N078,Diuretics,Monitoring,1,What should be monitored during diuretic therapy?,Only heart rate,Only haemoglobin,"Body weight, urine output, blood pressure, oedema, electrolytes and creatinine",Nothing if the patient is asymptomatic,,C,"Look for volume depletion, orthostatic hypotension and arrhythmias; adapt biological monitoring to the class used.","Diuretics and fluids deck, slide 42"
N079,Fluid solutions,Classification,1,Which of the following is a colloid?,Isofundin,0.9% sodium chloride,Lactated Ringer's,Gelatin,,D,"Crystalloids are small molecules (isotonic saline, Ringer's, Isofundin, 7.5% NaCl). Colloids are macromolecules: natural (FFP, albumin) and synthetic (dextrans, gelatins, HES).","Diuretics and fluids deck, slide 47"
N080,Fluid solutions,Classification,2,Which are NATURAL colloids?,Gelatins,Fresh frozen plasma,Human albumin,Hydroxyethyl starch,,B;C,"HES, gelatins and dextrans are synthetic.","Diuretics and fluids deck, slide 47"
N081,Fluid solutions,Crystalloids,2,"Hypertonic saline (7.5%, ~2,500 mOsm/L) works by:",Staying only in the plasma,Releasing albumin,Drawing water from the intracellular to the interstitial and plasma compartments,Increasing oncotic pressure,,C,Routine use is limited.,"Diuretics and fluids deck, slide 50"
N082,Fluid solutions,Crystalloids,2,Isotonic crystalloids:,Distribute across plasma and interstitial compartments (Starling forces),Shift water across cell membranes,Are effective whatever the blood loss,Remain entirely intravascular,,A,They are widely used with few adverse effects but have limited effect when blood loss exceeds 30% of blood volume.,"Diuretics and fluids deck, slide 49"
N083,Fluid solutions,Crystalloids,3,"Which solution contains lactate, and which has a chloride concentration of 154 mmol/L?",Isofundin contains lactate; LR has 154 chloride,NaCl 0.9% contains lactate; Isofundin has 154 chloride,Lactated Ringer's contains lactate (27.6 mmol/L); NaCl 0.9% has 154 mmol/L chloride,Plasma contains lactate; LR has 154 chloride,,C,"Plasma Cl- is 103 mmol/L; Isofundin 127, LR 108. Osmolarity: plasma 291, Isofundin 304, NaCl 0.9% 308, LR 271.","Diuretics and fluids deck, slide 51"
N084,Fluid solutions,Crystalloids,2,Lactated Ringer's should be avoided in:,Severe head or spinal injury,Liver failure,Hyperkalaemia,Extensive burns,,A;B;C,"Relative hypotonicity increases oedema risk in head injury, and lactate is a problem in liver failure. Burns and toxic epidermal necrolysis are general indications for crystalloids.","Diuretics and fluids deck, slide 52-53"
N085,Fluid solutions,Crystalloids,1,Main adverse effect of excessive crystalloid infusion:,Fluid overload and acute pulmonary oedema,Hypocoagulability,Osmotic nephrosis,Anaphylaxis,,A,"Those effects (anaphylactoid reactions, osmotic nephrosis, coagulation problems) are linked to synthetic colloids.","Diuretics and fluids deck, slide 53"
N086,Fluid solutions,Colloids,2,Albumin: which statements are correct?,"Available as 4%, 5% and 20%",It is a synthetic polysaccharide,Provides about 75-80% of plasma oncotic pressure,Elimination half-life is 17-18 days,,A;C;D,Distribution half-life 4 h; volume expansion capacity 80%. Drawbacks: cost and allergic reactions.,"Diuretics and fluids deck, slide 56-57"
N087,Fluid solutions,Colloids,2,Albumin may be used in:,Hepatorenal syndrome-AKI,Routine maintenance hydration,Extensive burns and Lyell syndrome,Septic shock (selected cases),,A;C;D,Also hypovolaemic shock.,"Diuretics and fluids deck, slide 57"
N088,Fluid solutions,Colloids,2,Gelatins:,Have a half-life of 17 days,Are bacterial polysaccharides,"Derive from animal collagen, mostly renally eliminated, half-life 3-4 h",Derive from corn starch,,C,"Examples: Plasmion, Hemacel, Plasmagel, Gelofusine. Expansion 70-80%.","Diuretics and fluids deck, slide 58"
N089,Fluid solutions,Colloids,2,Adverse effects of gelatins:,Acute pulmonary oedema in overdose,Allergic reactions,Interference with blood group determination,Osmotic nephrosis,,A;B;C,"Pregnancy is a contraindication. Indications: severe hypovolaemia, haemorrhagic shock while awaiting transfusion, anaesthetic hypotension.","Diuretics and fluids deck, slide 59"
N090,Fluid solutions,Colloids,3,Dextrans: which statements are correct?,They impair platelet adhesion and fibrin polymerisation,They are the safest colloid for pregnant women,1 g of dextran 40 retains about 30 mL of water,Bacterial polysaccharides,,A;C;D,"Dextran 70 retains 20-25 mL/g. Adverse effects also include anaphylactoid reactions, fetal distress and uterine hypertonus (pregnancy contraindication). Use is declining.","Diuretics and fluids deck, slide 60-63"
N091,Fluid solutions,Colloids,2,Hydroxyethyl starch (HES) is derived from:,Human plasma,Bacteria,Animal collagen,Corn starch (plant polysaccharide),,D,"Plasma volume expansion may exceed the infused volume and lasts a long time. Products: Lomol, Hesteril, Elohes, Voluven.","Diuretics and fluids deck, slide 64"
N092,Fluid solutions,Colloids,2,The main renal toxicity of HES is:,Renal stones,Interstitial nephritis,"Osmotic nephrosis (tubular deposition, hyperoncotic fall in GFR)",Glomerulonephritis,,C,"Other effects: hypersensitivity, coagulation disorders, raised serum amylase. Contraindicated in haemophilia and pregnancy.","Diuretics and fluids deck, slide 65-67"
N093,Fluid solutions,Prescribing,3,A patient has hypovolaemia from blood loss. What principle guides fluid choice?,Blood loss calls for blood products; fluid and electrolyte losses call for crystalloids or colloids,Always use albumin,Always use hypertonic saline,Always use HES,,A,"Also consider intravascular persistence, capillary barrier disruption and oedema risk, adverse effects over time on haemostasis, tissue oedema and organ function, and cost-effectiveness.","Diuretics and fluids deck, slide 69"
G001,GI bleeding,Fundamentals,1,Upper GI bleeding originates:,Distal to the ligament of Treitz,Only in the colon,"Proximal to the ligament of Treitz (oesophagus, stomach, duodenum)",Only in the stomach,,C,"UGIB is proximal to the ligament of Treitz and is about 4-5 times more common than LGIB. Peptic ulcer disease is the major cause. LGIB arises distally (small bowel, colon, rectum); diverticulosis is the major cause.","GI bleeding deck, slide 4-5"
G002,GI bleeding,Fundamentals,2,Coffee-ground emesis is dark brown and granular because:,Blood exposed to gastric acid oxidises haemoglobin into haematin,Of undigested food,It contains bile,It is swallowed epistaxis blood only,,A,"Coffee-ground material indicates altered, slower bleeding. Bright red haematemesis indicates active brisk upper bleeding. Gastric stasis can mimic the appearance.","GI bleeding deck, slide 6 and 15"
G003,GI bleeding,Fundamentals,2,Which can mimic melaena?,Bismuth-containing drugs,Haemorrhoids,Iron supplements,Charcoal,,A;C;D,"Also blueberries, spinach and liquorice. Iron-related black stool is not sticky and has no characteristic odour, unlike true melaena (black, sticky, tarry, strong odour). Haemorrhoids cause bright red blood.","GI bleeding deck, slide 6-7"
G004,GI bleeding,Fundamentals,1,What is the earliest haemodynamic sign of significant GI bleeding?,Syncope,Tachycardia,Hypotension at rest,Oliguria,,B,"Tachycardia comes first, then orthostatic hypotension, syncope and shock.","GI bleeding deck, slide 15"
G005,GI bleeding,History and exam,2,Which drugs increase the risk of GI bleeding?,NSAIDs and aspirin,Oral iron (causes real bleeding),SSRIs,Anticoagulants and antiplatelets,,A;C;D,"Iron and bismuth only turn the stool black, mimicking melaena (false positive).","GI bleeding deck, slide 16"
G006,GI bleeding,History and exam,1,Which examination must always be performed in a suspected GI bleed?,Fundoscopy,Hernial orifice only,Neurological examination,Rectal examination,,D,It confirms melaena or haematochezia and examines the anus and rectum.,"GI bleeding deck, slide 17"
G007,GI bleeding,Resuscitation,2,Initial resuscitation in an unstable GI bleeder includes:,Oxygen if saturation falls below 94%,Two large-bore IV lines (14-16G) and crossmatch,Crystalloid 500 mL boluses until blood is available,Immediate endoscopy before any resuscitation,,A;B;C,"Consider elective intubation for massive haematemesis or severe encephalopathy. Reassess BP, HR and urine output; avoid volume overload in the elderly and in heart failure.","GI bleeding deck, slide 10-11"
G008,GI bleeding,Resuscitation,2,At what haemoglobin should pRBC transfusion be started in a patient without cardiac disease (restrictive strategy)?,< 12 g/dL,< 7 g/dL,< 10 g/dL,< 5 g/dL,,B,"Target 7-9 g/dL after transfusion. With active acute coronary syndrome or severe ischaemic heart disease, a higher threshold up to 10 g/dL is used.","GI bleeding deck, slide 12"
G009,GI bleeding,Resuscitation,3,Match anticoagulant to reversal: dabigatran is reversed with:,Andexanet alfa,Platelet transfusion,Idarucizumab,Vitamin K and PCC,,C,"Warfarin: IV vitamin K plus PCC. Anti-Xa DOACs: andexanet alfa or 4-factor PCC for life-threatening bleeding. Platelet transfusion for antiplatelet users is generally not recommended unless the count is below 50,000/µL.","GI bleeding deck, slide 13"
G010,GI bleeding,Resuscitation,3,"A patient on aspirin and clopidogrel has a GI bleed with platelets 180,000/µL. Platelet transfusion is:","Indicated if the platelet count is above 400,000/µL","Generally not recommended unless the platelet count is < 50,000/µL",Recommended for all antiplatelet users,Mandatory,,B,Antiplatelet reversal by platelet transfusion is not generally recommended.,"GI bleeding deck, slide 13"
G011,GI bleeding,Upper GI bleeding,2,What is the most common cause of UGIB?,Peptic ulcer disease (40-50%),Oesophageal varices,Angiodysplasia,Mallory-Weiss syndrome,,A,"Risk factors: H. pylori, chronic NSAID or low-dose aspirin use, and severe physiological stress. Varices account for 10-20% but carry by far the highest mortality.","GI bleeding deck, slide 18-19"
G012,GI bleeding,Upper GI bleeding,2,Mallory-Weiss syndrome:,Is a longitudinal mucosal tear at the gastro-oesophageal junction,Follows severe retching or vomiting,Is caused by portal hypertension,Stops spontaneously in about 90% of cases,,A;B;D,Classic in alcohol intoxication or hyperemesis gravidarum; no specific endoscopic treatment is usually required.,"GI bleeding deck, slide 20"
G013,GI bleeding,Upper GI bleeding,3,Dieulafoy's lesion is:,A venous malformation of the right colon,A stricture,A longitudinal tear,"A large aberrant submucosal artery eroding through the mucosa, usually high on the lesser curvature",,D,"Endoscopic treatment is with hemoclips. Other causes: malignancy, erosive gastritis/oesophagitis, angiodysplasia, gastric antral vascular ectasia (band ligation).","GI bleeding deck, slide 21 and 27-28"
G014,GI bleeding,Risk scores,2,A Glasgow-Blatchford score of 0 means:,Very low risk; can be managed as an outpatient without early endoscopy,High risk; urgent ICU,Variceal bleeding,Need for transfusion,,A,"Variables: BUN elevated out of proportion to creatinine, low haemoglobin, SBP < 110 mmHg, pulse > 100, melaena, syncope, liver disease, heart failure.","GI bleeding deck, slide 22"
G015,GI bleeding,Risk scores,3,Which are Glasgow-Blatchford variables?,Serum albumin,Syncope,Systolic BP < 110 mmHg,Melaena,,B;C;D,"Also: pulse > 100, liver disease, heart failure, raised BUN and low Hb.","GI bleeding deck, slide 22"
