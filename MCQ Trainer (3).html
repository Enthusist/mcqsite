G016,GI bleeding,Pre-endoscopy,2,IV PPI regimen before endoscopy in UGIB:,Pantoprazole 20 mg orally,Pantoprazole 80 mg bolus followed by 8 mg/h infusion,Ranitidine bolus,Omeprazole 10 mg daily,,B,"It neutralises acid (pH > 6), preventing clot lysis. It does not reduce overall mortality but reduces the need for endoscopic intervention by downstaging high-risk stigmata.","GI bleeding deck, slide 23"
G017,GI bleeding,Pre-endoscopy,2,"Vasoactive drugs (terlipressin, octreotide, somatostatin) are mandatory in:",Every peptic ulcer bleed,LGIB from diverticula,Mallory-Weiss tear,Suspected variceal bleeding,,D,"They cause splanchnic vasoconstriction, lowering portal inflow and pressure. Give them as early as possible in the ER, before endoscopy.","GI bleeding deck, slide 24"
G018,GI bleeding,Pre-endoscopy,2,Antibiotic prophylaxis in a cirrhotic patient with GI haemorrhage:,IV ceftriaxone 1 g daily for up to 7 days,Indicated only for varices,Indicated in all cirrhotic patients with any GI bleed,Not needed,,A;C,"Bacterial infection triggers rebleeding; antibiotics reduce mortality, infections and early rebleeding. The indication is regardless of source, so 'only for varices' is wrong.","GI bleeding deck, slide 25"
G019,GI bleeding,Endoscopy,2,Timing of upper endoscopy in admitted UGIB:,"Within 24 h; within 12 h if haemodynamically unstable or suspected variceal bleeding, after resuscitation",Within 7 days,Only if rebleeding,"Always immediately, before resuscitation",,A,"Resuscitate first, then perform EGD.","GI bleeding deck, slide 26"
G020,GI bleeding,Endoscopy,2,Standard endoscopic treatment of a bleeding peptic ulcer with high-risk stigmata:,Observation,PPI alone,Epinephrine injection alone,Dual therapy: diluted epinephrine injection plus a mechanical or thermal method,,D,"Mechanical: endoclips; thermal: APC or heater probe. Use the Forrest classification to separate low risk (IIb, IIc, III) from high rebleeding risk.","GI bleeding deck, slide 27"
G021,GI bleeding,Endoscopy,2,Treatment of choice for oesophageal varices:,Argon plasma coagulation,Endoscopic variceal ligation (banding),Sclerotherapy,Cyanoacrylate glue,,B,EVL strangulates the varix at its base to induce thrombosis. Sclerotherapy is not recommended for oesophageal varices. Gastric varices: cyanoacrylate glue or band ligation depending on location.,"GI bleeding deck, slide 29"
G022,GI bleeding,Post-endoscopy,2,After endoscopic treatment of a peptic ulcer with high-risk stigmata:,IV PPI for 7 days then stop,Oral PPI only for 3 days,"High-dose IV PPI for 72 h, then oral PPI",No PPI,,C,H. pylori testing and eradication is mandatory. Do a check-up endoscopy with biopsies for gastric ulcers.,"GI bleeding deck, slide 30"
G023,GI bleeding,Post-endoscopy,2,After variceal bleeding:,Start NSAIDs,"Non-selective beta-blockers (propranolol, carvedilol) for secondary prophylaxis once stable",Stop all drugs after endoscopy,Vasoactive drugs for 3-5 days,,B;D,Vasoactive treatment prevents early rebleeding.,"GI bleeding deck, slide 30"
G024,GI bleeding,Refractory bleeding,3,Rescue therapy for uncontrolled variceal bleeding:,Laparotomy as first choice,TIPS,Repeat PPI infusion,Angiographic embolisation,,B,Embolisation is the rescue option for refractory non-variceal bleeding (e.g. duodenal ulcer eroding the gastroduodenal artery). Surgery is a last resort because of high mortality. Re-endoscopy is attempted first if haemostasis fails or rebleeding occurs within 24 h.,"GI bleeding deck, slide 31"
G025,GI bleeding,Lower GI bleeding,2,"Compared with UGIB, LGIB:",Presents typically with haematochezia,Is more common worldwide,Is more often haemodynamically stable on arrival,Stops spontaneously in 80-85% of cases,,A;C;D,UGIB is about 4-5 times more common than LGIB.,"GI bleeding deck, slide 33-34 and 4"
G026,GI bleeding,Lower GI bleeding,2,Haematochezia in an unstable patient with massive bleeding suggests:,A haemorrhoidal source,IBD,A brisk upper GI source; perform EGD first,Irritable bowel,,C,"If unstable with massive haematochezia, assume brisk UGIB and do EGD first. If you cannot stabilise the patient for bowel prep, go straight to CT angiography.","GI bleeding deck, slide 34 and 37"
G027,GI bleeding,Lower GI bleeding,2,An Oakland score of 8 or less indicates:,Need for surgery,More than 95% probability of safe discharge for outpatient colonoscopy,High risk,Need for transfusion,,B,"Variables: age, sex, previous LGIB admission, blood on DRE, heart rate, SBP and admission Hb (most heavily weighted).","GI bleeding deck, slide 36"
G028,GI bleeding,Lower GI bleeding,2,Stable patient with LGIB: what is the standard pathway?,Discharge without investigation,Surgery,"Admit, rapid bowel preparation (PEG) and colonoscopy within 24 hours",CT angiography first,,C,"If UGIB is suspected (melaena, severe anaemia), do upper endoscopy first. In unstable patients who cannot be prepared, do CT angiography.","GI bleeding deck, slide 37"
G029,GI bleeding,Lower GI bleeding,2,Most common cause of significant LGIB in adults:,Haemorrhoids,Diverticular bleeding (up to 50%),Angiodysplasia,Colorectal cancer,,B,"Typically acute, painless, bright red or maroon haematochezia, which stops spontaneously in most cases but often recurs. Diagnosis by colonoscopy.","GI bleeding deck, slide 39"
G030,GI bleeding,Lower GI bleeding,2,Angiodysplasia is associated with:,Chronic kidney disease,Advanced age,Aortic stenosis (Heyde syndrome),Young age and cirrhosis only,,A;B;C,Usually in the right colon; venous painless bleeding. Argon plasma coagulation is the treatment of choice.,"GI bleeding deck, slide 41 and 44"
G031,GI bleeding,Lower GI bleeding,2,Which features favour an anal fissure?,Severe tearing abdominal pain,Minor bright red blood,Tearing pain during and after defecation,Painless drops of blood coating stool (haemorrhoid-like),,B;C,Painless intermittent bright red blood coating the stool suggests haemorrhoids. In older patients these are diagnoses of exclusion until colon cancer is ruled out.,"GI bleeding deck, slide 42"
G032,GI bleeding,Lower GI bleeding,2,"Sudden lower abdominal cramps followed by bloody diarrhoea in an elderly patient, in the splenic flexure region, suggests:",Diverticular bleeding,Haemorrhoids,Ischaemic colitis,Angiodysplasia,,C,"Ischaemic colitis involves watershed areas. Mesenteric infarction: severe tearing abdominal pain, GI bleeding is a late sign, extremely high mortality.","GI bleeding deck, slide 43"
G033,GI bleeding,Lower GI bleeding,2,CT angiography detects active bleeding when the rate is at least:,Any rate,50 mL/min,5 mL/min,0.3-0.5 mL/min,,D,"It is non-invasive, needs no bowel prep and localises the bleeding to guide embolisation or segmental surgery.","GI bleeding deck, slide 38 and 45"
G034,GI bleeding,Lower GI bleeding,2,Capsule endoscopy:,Studies the small intestine,Identifies the site in about 75% of obscure cases,Allows therapeutic treatment,Is used in obscure GI bleeding after negative colonoscopy and upper endoscopy,,A;B;D,It requires bowel prep and is not therapeutic; enteroscopy is invasive but allows treatment.,"GI bleeding deck, slide 38"
G035,GI bleeding,Lower GI bleeding,3,Angiographic embolisation in LGIB carries which rare severe complication?,Hepatic failure,Pancreatitis,Bowel ischaemia or infarction,Pulmonary embolism,,C,It is indicated if CTA is positive and the patient is too unstable for colonoscopy; microcoils or Gelfoam are used.,"GI bleeding deck, slide 46"
G036,GI bleeding,Lower GI bleeding,3,Which is a surgical indication in LGIB?,Diverticulosis without bleeding,Instability despite resuscitation requiring more than 6 units of PRBCs,Haemorrhoids,First episode of stable bleeding,,B,Segmental resection is preferred if the site is localised; subtotal colectomy if the patient is exsanguinating with an unlocalised source (high morbidity).,"GI bleeding deck, slide 47"
G037,GI bleeding,Clinical cases,3,"60-year-old alcoholic, large haematemesis, confusion, BP 85/50, HR 120, Hb 6.8, jaundice and spider angiomata. Which are appropriate immediate measures?",Endoscopy with variceal ligation within 12 hours,Cautious transfusion targeting Hb around 7 g/dL,Elective intubation to protect the airway,IV terlipressin and IV ceftriaxone,,A;B;C;D,Acute variceal haemorrhage on cirrhosis. Also give PPI. Do not over-transfuse.,"GI bleeding deck, slide 49-51"
G038,GI bleeding,Clinical cases,2,"75-year-old woman on daily naproxen, melaena, Hb 8.2 g/dL, BUN/Cr ratio > 35. What is the plan?",Start vasoactive drugs,Colonoscopy tomorrow,"Stop naproxen, IV PPI (80 mg bolus then infusion), fluid challenge, endoscopy within 24 hours, no transfusion yet",Immediate transfusion of 4 units,,C,Bleeding peptic ulcer from NSAIDs. A BUN/creatinine ratio above 35 is highly suggestive of UGIB. Transfusion is not indicated as Hb > 7.,"GI bleeding deck, slide 52-54"
G039,GI bleeding,Clinical cases,2,"65-year-old, sudden painless large-volume bright red bleeding, stable vitals, Hb 12.5, low Oakland score. Most likely diagnosis and plan?","Diverticular haemorrhage; admit, PEG preparation, colonoscopy within 24 h",Variceal bleeding; TIPS,Haemorrhoids; discharge,Angiodysplasia; emergency surgery,,A,"If major instability develops before prep finishes, pivot to CT angiography.","GI bleeding deck, slide 55-56"
J001,Jaundice,Physiology,2,Blood flow and bile flow in the hepatic lobule:,Blood flows centripetally (portal triad to central vein); bile flows centrifugally (hepatocytes to bile duct of the portal triad),Bile flows centripetally,Both flow toward the portal triad,Both flow toward the central vein,,A,"Blood comes from the portal vein (nutrient-rich) and hepatic artery (oxygen-rich), through the sinusoids to the central vein. Bile goes hepatocytes → canaliculi → bile duct.","Jaundice deck, slide 3-4"
J002,Jaundice,Physiology,2,Which is the correct anatomical sequence for bile?,Right hepatic duct → canaliculi → common hepatic duct,Ampulla → common hepatic duct,Common bile duct → cystic duct → gallbladder,Canaliculi → ductules → septal ducts → right/left hepatic ducts → common hepatic duct,,D,The CBD forms below the cystic duct junction and joins the main pancreatic duct (Wirsung) to form the ampulla of Vater.,"Jaundice deck, slide 5"
J003,Jaundice,Physiology,2,Bile composition: which statements are correct?,About 0.5-1 L is secreted per day,Its main pigment is unconjugated bilirubin,It is alkaline (pH 7.6-8.6),Bile salts are made from cholesterol and emulsify fat,,A;C;D,The biliary pigment is conjugated bilirubin. Bicarbonate is secreted by cholangiocytes; lecithin helps micelle formation.,"Jaundice deck, slide 6"
J004,Jaundice,Physiology,2,The hepatocyte conjugates bilirubin with:,Albumin,Glucuronic acid,Glycine,Sulfate only,,B,"Conjugated bilirubin is water-soluble and is actively secreted into the bile canaliculi. In the gut, bacteria convert it to urobilinogen; most becomes stercobilin (brown stool), a small fraction is reabsorbed, and some is excreted as urobilin (urine colour).","Jaundice deck, slide 7"
J005,Jaundice,Physiology,2,Why does dark urine suggest conjugated hyperbilirubinaemia?,Unconjugated bilirubin is water-soluble,Unconjugated bilirubin is excreted by the kidney,Conjugated bilirubin is water-soluble and can be excreted in urine,Urobilin is increased in obstruction,,C,"Unconjugated bilirubin is lipid-soluble, cannot be excreted in urine, and can cross the blood-brain barrier (kernicterus in neonates).","Jaundice deck, slide 8"
J006,Jaundice,Mechanisms,2,Match the mechanism to the type of jaundice:,Haemolysis and Gilbert syndrome cause unconjugated jaundice,Cholestasis causes unconjugated jaundice,Gilbert syndrome causes conjugated jaundice,Dubin-Johnson and Rotor syndromes cause unconjugated jaundice,,A,"Dubin-Johnson and Rotor (inability to transport bilirubin from hepatocyte to bile) cause conjugated jaundice, as does cholestasis (decreased bile flow).","Jaundice deck, slide 9"
J007,Jaundice,Clinical approach,1,Jaundice becomes clinically apparent when total bilirubin exceeds about:,1 mg/L,100 mg/L,20-30 mg/L,5 mg/L,,C,"Examine under natural light. Distinguish from carotenaemia (palms, soles, forehead, nasolabial folds; sclerae spared) and from drugs such as quinacrine and rifampicin.","Jaundice deck, slide 11"
J008,Jaundice,Clinical approach,2,Pruritus in cholestasis is mainly caused by:,Bilirubin deposition in skin,Accumulation of bile salts in plasma,Eosinophilia,Hyperglycaemia,,B,Pruritus points to cholestasis. Pale clay-coloured stools reflect reduced bilirubin reaching the intestine.,"Jaundice deck, slide 13 and 15"
J009,Jaundice,Clinical approach,2,Which clinical cues indicate cholestasis?,Dark urine,Brown stools with normal urine,Pruritus,Pale or clay-coloured stools,,A;C;D,Jaundice + weight loss + painless obstruction suggests malignancy; fever + jaundice + RUQ pain suggests acute cholangitis; jaundice + altered mental status suggests encephalopathy from acute liver failure.,"Jaundice deck, slide 15"
J010,Jaundice,Emergencies,1,Charcot's triad consists of:,"RUQ pain, fever and jaundice","Jaundice, ascites and encephalopathy","Fever, rash and arthralgia","Pain, vomiting and diarrhoea",,A,"It indicates acute cholangitis, a medical emergency requiring antibiotics and biliary drainage.","Jaundice deck, slide 14"
J011,Jaundice,Emergencies,2,Jaundice with confusion and asterixis suggests:,Biliary colic,Carotenaemia,Gilbert syndrome,"Hepatic encephalopathy / acute liver failure, an emergency",,D,"Always check temperature and alertness, look for asterixis and signs of chronic liver disease (splenomegaly, ascites, caput medusae, spider angiomata, palmar erythema, gynaecomastia).","Jaundice deck, slide 14"
J012,Jaundice,Clinical approach,2,Courvoisier's sign (palpable non-tender gallbladder with jaundice) raises suspicion of:,Hepatitis A,Acute cholecystitis,Gilbert syndrome,Malignant obstruction of the distal bile duct,,D,Courvoisier's sign is looked for on abdominal examination of the jaundiced patient.,"Jaundice deck, slide 14 and 25-27"
J013,Jaundice,Investigations,1,What is the first investigation in jaundice?,Liver biopsy,"Serum bilirubin, with direct/indirect fractionation",ERCP,Abdominal CT,,B,"It confirms jaundice and gives the first classification: unconjugated versus conjugated hyperbilirubinaemia, then hepatocellular versus cholestatic pattern with AST/ALT and ALP/GGT.","Jaundice deck, slide 16"
J014,Jaundice,Investigations,2,AST/ALT and ALP/GGT respectively are markers of:,Cytolysis/hepatocyte injury; cholestasis,Haemolysis; cytolysis,Synthetic function; cholestasis,Cholestasis; cytolysis,,A,"Synthetic liver function is assessed by INR, prothrombin time and albumin.","Jaundice deck, slide 16"
J015,Jaundice,Investigations,2,Which findings support haemolysis?,Raised LDH,Low haptoglobin,Raised reticulocyte count,Positive Coombs test,,A;B;C;D,Also anaemia and schistocytes on the smear. Predominant indirect hyperbilirubinaemia suggests haemolysis or impaired conjugation.,"Jaundice deck, slide 16"
J016,Jaundice,Investigations,2,When is abdominal ultrasound indicated in jaundice?,Only after ERCP,"In conjugated hyperbilirubinaemia, as the first-line imaging",In predominantly unconjugated hyperbilirubinaemia,Never,,B,"It is quick, cheap and non-invasive and looks for dilated bile ducts, the level and cause of obstruction, and signs of chronic liver disease.","Jaundice deck, slide 17 and 22"
J017,Jaundice,Investigations,2,Conjugated hyperbilirubinaemia with DILATED bile ducts on ultrasound indicates:,Gilbert syndrome,Post-hepatic (extrahepatic) cholestasis,Intrahepatic cholestasis,Haemolysis,,B,"Further work-up uses MRCP, EUS, CT or ERCP. With non-dilated ducts: intrahepatic cholestasis; workup includes viral serology, iron and copper, autoimmune markers, and liver biopsy if inconclusive.","Jaundice deck, slide 18"
J018,Jaundice,Aetiologies,2,Which are the three main MALIGNANT causes of post-hepatic cholestasis?,Vaterian ampulloma,Primary biliary cholangitis,Pancreatic head cancer,Cholangiocarcinoma,,A;C;D,"Non-malignant: choledocholithiasis, chronic pancreatitis, sclerosing cholangitis. Primary biliary cholangitis is an intrahepatic cause (destruction of small intrahepatic ducts).","Jaundice deck, slide 18"
J019,Jaundice,Aetiologies,2,Which are NON-malignant causes of post-hepatic cholestasis?,Sclerosing cholangitis,Chronic pancreatitis,Choledocholithiasis,Pancreatic head cancer,,A;B;C,"Cancer of the pancreatic head, cholangiocarcinoma and ampulloma are the malignant ones.","Jaundice deck, slide 18"
J020,Jaundice,Aetiologies,3,Intrahepatic cholestasis mechanisms include:,"Hepatocyte dysfunction (hepatitis, cirrhosis)","Obstruction of small intrahepatic ducts (tumours, infiltration)",Destruction of small intrahepatic ducts (PBC),Choledocholithiasis,,A;B;C,Choledocholithiasis is an extrahepatic (post-hepatic) cause.,"Jaundice deck, slide 18"
J021,Jaundice,Clinical cases,2,"24-year-old, yellow eyes for 2 days, one earlier episode during exams, normal stool and urine, total bilirubin 58 µmol/L (direct 8), normal liver enzymes and Hb. Type of jaundice and most likely diagnoses?",Unconjugated; haemolysis or Gilbert syndrome,Conjugated; hepatitis,Conjugated; cholestasis,Unconjugated; pancreatic cancer,,A,"Normal reticulocytes, LDH, haptoglobin and smear rule out haemolysis, making Gilbert syndrome most likely. Ultrasound is not necessary when hyperbilirubinaemia is predominantly unconjugated.","Jaundice deck, slide 20-22"
J022,Jaundice,Clinical cases,2,Same case: would you order an abdominal ultrasound?,"Yes, CT","No, it is not necessary in predominantly unconjugated hyperbilirubinaemia","Yes, always","Yes, ERCP",,B,Ultrasound is indicated in conjugated hyperbilirubinaemia.,"Jaundice deck, slide 22"
J023,Jaundice,Clinical cases,3,"42-year-old woman, jaundice for 5 days, dark urine, ALT 1,250, AST 850, ALP 180, GGT 210, bilirubin 145 (direct 105), normal ultrasound. Pattern and immediate next step?",Haemolysis; transfusion,Cholestatic pattern; ERCP,Hepatocellular injury; assess severity with INR and prothrombin time,Biliary obstruction; surgery,,C,"Differentials: acute viral hepatitis, drug-induced liver injury, autoimmune and ischaemic hepatitis; acute biliary obstruction is less likely. Key history: medications and herbal products, alcohol, travel, viral risk factors, autoimmune and gallstone history.","Jaundice deck, slide 23-24"
J024,Jaundice,Clinical cases,3,"67-year-old, jaundice for 2 months, intense pruritus, dark urine, pale stools, 7 kg weight loss, ALP 1780, GGT 1920, bilirubin 280 (direct 235). Pattern and first-line exam?",Cholestatic pattern; abdominal ultrasound to separate intra- from extrahepatic cholestasis,Hepatocellular pattern; liver biopsy,Cholestatic pattern; ERCP immediately,Haemolytic pattern; Coombs test,,A,"The presentation suggests cholestatic, possibly malignant jaundice (age, weight loss, progressive course).","Jaundice deck, slide 25-26"
J025,Jaundice,Clinical cases,3,"In the same patient, ultrasound shows dilated common bile duct and intrahepatic ducts, a distended gallbladder and no stones. Conclusion and next exam?",Intrahepatic cholestasis; biopsy,Extrahepatic obstruction; CT scan (pancreatic cancer likely),Hepatitis; viral serology,Gilbert syndrome; reassurance,,B,"Age, weight loss, no biliary history and no stones in imaging point to pancreatic cancer.","Jaundice deck, slide 27"
J026,Jaundice,Clinical approach,2,Which are the five key questions in a jaundiced patient?,What is the liver enzyme pattern (cytolysis vs cholestasis)?,Which bilirubin is elevated (conjugated vs unconjugated)?,Is it really jaundice?,"Is there an emergency (cholangitis, acute liver failure)?",,A;B;C;D,"The fifth question is where the problem is: pre-hepatic, hepatic or post-hepatic.","Jaundice deck, slide 28"
</script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var ALL=[],pool=[],i=0,res={},sel=[],done=false,srcName="";
var LET="ABCDE";

/* ---------- CSV ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  var first=text.split(/\r?\n/)[0]||"";
  var d=(first.split(";").length>first.split(",").length)?";":(first.split("\t").length>first.split(",").length?"\t":",");
  var rows=[],row=[],f="",q=false,k=0,c;
  for(;k<text.length;k++){
    c=text[k];
    if(q){ if(c==='"'){ if(text[k+1]==='"'){f+='"';k++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===d){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[k+1]==="\n")k++; row.push(f);f=""; if(row.some(function(x){return x.trim()!==""}))rows.push(row); row=[] }
    else f+=c;
  }
  row.push(f); if(row.some(function(x){return x.trim()!==""}))rows.push(row);
  return rows;
}
function toQuestions(text){
  var rows=parseCSV(text); if(rows.length<2) throw new Error("No data rows found. The first row must be the header.");
  var h=rows[0].map(function(x){return x.trim().toLowerCase()});
  var need=["question","option_a","option_b","correct"];
  need.forEach(function(n){ if(h.indexOf(n)<0) throw new Error('Missing column "'+n+'". Required: question, option_a, option_b, correct.') });
  var out=[],bad=[];
  rows.slice(1).forEach(function(r,n){
    var o={}; h.forEach(function(k,j){o[k]=(r[j]||"").trim()});
    var opts=[]; "abcde".split("").forEach(function(l){ if(o["option_"+l]) opts.push({k:l.toUpperCase(),t:o["option_"+l]}) });
    var cor=(o.correct||"").toUpperCase().split(/[^A-E]+/).filter(Boolean);
    var valid=o.question&&opts.length>=2&&cor.length&&cor.every(function(x){return opts.some(function(p){return p.k===x})});
    if(!valid){bad.push(n+2);return}
    out.push({id:o.id||("R"+(n+2)),topic:o.topic||"General",sub:o.subtopic||"",diff:o.difficulty||"",q:o.question,opts:opts,cor:cor,note:o.note||"",src:o.source||""});
  });
  if(!out.length) throw new Error("No valid questions. Check that each row has a question, at least two options and a correct letter that exists.");
  return {qs:out,bad:bad};
}

/* ---------- load ---------- */
function setSet(text,name){
  var r=toQuestions(text); ALL=r.qs; srcName=name;
  $("err").textContent=r.bad.length?("Skipped "+r.bad.length+" invalid row(s): line "+r.bad.slice(0,8).join(", ")+(r.bad.length>8?"…":"")):"";
  $("src").textContent=name+" · "+ALL.length+" questions";
  fillFilters(); start();
}
function uniq(a){return a.filter(function(v,k){return v&&a.indexOf(v)===k})}
function fillFilters(){
  var t=$("fTopic"); t.innerHTML=""; add(t,"","All topics");
  uniq(ALL.map(function(x){return x.topic})).forEach(function(v){add(t,v,v)});
  fillSub();
}
function fillSub(){
  var s=$("fSub"),t=$("fTopic").value; s.innerHTML=""; add(s,"","All subtopics");
  uniq(ALL.filter(function(x){return !t||x.topic===t}).map(function(x){return x.sub})).forEach(function(v){add(s,v,v)});
}
function add(s,v,t){var o=document.createElement("option");o.value=v;o.textContent=t;s.appendChild(o)}
function shuffle(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}

function start(list){
  var t=$("fTopic").value,s=$("fSub").value,d=$("fDiff").value;
  pool=list||ALL.filter(function(x){return (!t||x.topic===t)&&(!s||x.sub===s)&&(!d||x.diff===d)});
  pool=pool.slice(); if($("shufQ").checked) shuffle(pool);
  i=0;res={};load();
}
function load(){
  done=false;sel=[];
  if(!pool.length){ $("card").innerHTML="";var p=document.createElement("p");p.textContent="No questions match these filters.";$("card").appendChild(p);prog();return }
  if(i>=pool.length){ summary();return }
  var x=pool[i]; x.view=$("shufO").checked?shuffle(x.opts.slice()):x.opts;
  render();prog();
}
function prog(){
  var n=pool.length,ok=0,a=0; Object.keys(res).forEach(function(k){a++; if(res[k])ok++});
  $("pos").textContent=n?("Q "+Math.min(i+1,n)+" / "+n):"";
  $("fill").style.width=(n?(i/n*100):0)+"%";
  $("score").textContent=a?(ok+" / "+a+" correct"):"";
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}

function render(){
  var x=pool[i],c=$("card"),multi=x.cor.length>1; c.innerHTML="";
  var m=el("div","meta"); m.appendChild(el("span",null,x.topic)); if(x.sub)m.appendChild(el("span",null,x.sub));
  if(x.diff)m.appendChild(el("span",null,"Level "+x.diff)); m.appendChild(el("span","tag",x.id)); c.appendChild(m);
  c.appendChild(el("p","q",x.q));
  if(multi)c.appendChild(el("div","hint","Select all that apply, then validate."));
  var ul=el("ul","opts");
  x.view.forEach(function(o,k){
    var li=document.createElement("li"),b=el("button","opt"); b.type="button"; b.dataset.k=o.k;
    b.appendChild(el("span","l",LET[k])); b.appendChild(el("span","t",o.t));
    b.onclick=function(){pick(o.k)}; li.appendChild(b); ul.appendChild(li);
  });
  c.appendChild(ul);
  var a=el("div","actions"); a.id="act"; c.appendChild(a); acts();
}
function acts(){
  var a=$("act"); a.innerHTML=""; var x=pool[i];
  var skip=el("button","btn",done?"":"Skip"); skip.type="button"; skip.onclick=next;
  if(!done){
    a.appendChild(skip);
    if(x.cor.length>1){var v=el("button","btn primary","Validate");v.type="button";v.id="val";v.disabled=!sel.length;v.onclick=validate;a.appendChild(v)}
  } else {
    a.appendChild(el("span"));
    var n=el("button","btn primary",i+1>=pool.length?"See results":"Next question"); n.type="button"; n.id="nxt"; n.onclick=next; a.appendChild(n); n.focus();
  }
}
function pick(k){
  if(done)return; var x=pool[i];
  if(x.cor.length===1){sel=[k];validate();return}
  var p=sel.indexOf(k); if(p<0)sel.push(k); else sel.splice(p,1);
  document.querySelectorAll(".opt").forEach(function(b){b.classList.toggle("sel",sel.indexOf(b.dataset.k)>=0)});
  $("val").disabled=!sel.length;
}
function validate(){
  if(done||!sel.length)return; var x=pool[i]; done=true;
  var ok=sel.length===x.cor.length&&sel.every(function(s){return x.cor.indexOf(s)>=0});
  res[x.id+"#"+i]=ok;
  document.querySelectorAll(".opt").forEach(function(b){
    var k=b.dataset.k,isC=x.cor.indexOf(k)>=0,isS=sel.indexOf(k)>=0; b.disabled=true; b.classList.remove("sel");
    if(isC&&isS)b.classList.add("ok"); else if(isS)b.classList.add("no"); else if(isC)b.classList.add("miss");
    if(isC&&!isS){b.firstChild.textContent=b.firstChild.textContent}
  });
  var n=el("div","note "+(ok?"right":"wrong")); n.appendChild(el("b",null,(ok?"Correct":"Incorrect")+" · answer "+x.cor.join(", ")));
  n.appendChild(el("p",null,x.note||"No note provided for this question."));
  if(x.src)n.appendChild(el("small",null,"Source: "+x.src));
  $("card").insertBefore(n,$("act")); acts(); prog();
}
function next(){i++;load()}
function summary(){
  var c=$("card"),n=pool.length,ok=0,miss=[]; c.innerHTML="";
  pool.forEach(function(x,k){ var r=res[x.id+"#"+k]; if(r)ok++; else miss.push(x) });
  var s=el("div","sum"); s.appendChild(el("div","hint","Session complete"));
  s.appendChild(el("div","score",ok+" / "+n)); s.appendChild(el("div",null,Math.round(ok/n*100)+"% correct"+(miss.length?". Missed or skipped:":".")));
  if(miss.length){var ul=el("ul"); miss.forEach(function(x){ul.appendChild(el("li",null,x.q))}); s.appendChild(ul)}
  var b=el("div","actions");
  var r1=el("button","btn","Restart all"); r1.onclick=function(){start()};
  b.appendChild(r1);
  if(miss.length){var r2=el("button","btn primary","Retry "+miss.length+" missed"); r2.onclick=function(){start(miss)}; b.appendChild(r2)}
  s.appendChild(b); c.appendChild(s); $("fill").style.width="100%"; $("pos").textContent="Done";
}

/* ---------- wiring ---------- */
$("fTopic").onchange=function(){fillSub();start()};
["fSub","fDiff","shufQ"].forEach(function(id){$(id).onchange=function(){start()}});
$("shufO").onchange=function(){ if(!done&&pool.length&&i<pool.length){ pool[i].view=$("shufO").checked?shuffle(pool[i].opts.slice()):pool[i].opts; sel=[]; render() } };
$("file").onchange=function(e){
  var f=e.target.files[0]; if(!f)return; var r=new FileReader();
  r.onload=function(){try{setSet(String(r.result),f.name)}catch(x){$("err").textContent=x.message}};
  r.readAsText(f,"utf-8");
};
$("loadPaste").onclick=function(){try{setSet($("paste").value,"Pasted CSV")}catch(x){$("err").textContent=x.message}};
$("reset").onclick=function(){try{setSet($("defcsv").textContent,"Built-in set")}catch(x){$("err").textContent=x.message}};
document.addEventListener("keydown",function(e){
  var t=e.target.tagName; if(t==="TEXTAREA"||t==="SELECT"||t==="INPUT"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(!pool.length||i>=pool.length)return;
  var k=e.key.toUpperCase(),x=pool[i];
  if(!done){ var idx=LET.indexOf(k); if(k.length===1&&idx>=0&&idx<x.view.length){pick(x.view[idx].k)} else if(e.key==="Enter"&&x.cor.length>1&&sel.length){validate()} }
});
var modes=["auto","light","dark"],mode="auto";
try{mode=localStorage.getItem("mcq-theme")||"auto"}catch(x){}
function applyTheme(){
  var r=document.documentElement;
  if(mode==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",mode);
  $("theme").textContent="Theme: "+mode[0].toUpperCase()+mode.slice(1);
}
$("theme").onclick=function(){
  mode=modes[(modes.indexOf(mode)+1)%3];
  try{localStorage.setItem("mcq-theme",mode)}catch(x){}
  applyTheme();
};
applyTheme();
try{ setSet($("defcsv").textContent,"Built-in set") }catch(x){ $("err").textContent=x.message }
})();
